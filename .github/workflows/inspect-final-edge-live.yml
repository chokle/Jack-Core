name: Inspect Final Edge Live

on:
  push:
    branches:
      - ops/edge-inspect-final-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Inspect DNS, Worker route, root headers, and health once
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          async function cf(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { headers: { Authorization: `Bearer ${token}` } });
            const payload = await response.json();
            if (!response.ok || payload.success === false) throw new Error(`${path}: ${response.status} ${JSON.stringify(payload.errors ?? [])}`);
            return payload.result;
          }
          const zones = await cf('/zones?name=torchlabs.ca&status=active&per_page=50');
          const zone = zones[0];
          const records = await cf(`/zones/${zone.id}/dns_records?name=jack.torchlabs.ca&per_page=100`);
          const routes = await cf(`/zones/${zone.id}/workers/routes`);
          console.log('DNS_STATE', JSON.stringify(records.map((r) => ({ id: r.id, type: r.type, name: r.name, content: r.content, proxied: r.proxied, ttl: r.ttl, modified_on: r.modified_on })), null, 2));
          console.log('ROUTE_STATE', JSON.stringify(routes.filter((r) => r.pattern.includes('jack.torchlabs.ca')).map((r) => ({ id: r.id, pattern: r.pattern, script: r.script })), null, 2));
          for (const path of ['/', '/sign-in', '/api/healthz']) {
            try {
              const response = await fetch(`https://jack.torchlabs.ca${path}?inspect=${Date.now()}`, { redirect: 'follow', headers: { 'cache-control': 'no-cache' } });
              const text = await response.text();
              console.log('PUBLIC_RESPONSE', JSON.stringify({
                path,
                status: response.status,
                url: response.url,
                headers: Object.fromEntries([...response.headers.entries()].filter(([name]) => ['content-type','content-security-policy','x-jack-edge-recovery','server','cf-ray'].includes(name.toLowerCase()))),
                title: text.match(/<title>([^<]*)<\/title>/i)?.[1] ?? null,
                bodyPrefix: text.slice(0, 500).replace(/\s+/g, ' '),
                hasClerkUI: text.includes('https://clerk.torchlabs.ca'),
                hasInsightsScript: text.includes('https://static.cloudflareinsights.com'),
              }, null, 2));
            } catch (error) {
              console.log('PUBLIC_ERROR', JSON.stringify({ path, error: String(error) }));
            }
          }
          NODE
