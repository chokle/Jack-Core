name: Superintendent EOD Primary Repair (one-shot)

on:
  push:
    branches:
      - fix/pilot002-auto-bootstrap-20260830
    paths:
      - .github/workflows/superintendent-eod-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pilot002-auto-bootstrap-20260830
          fetch-depth: 0

      - name: Apply bounded EOD architecture correction
        shell: python
        run: |
          from pathlib import Path

          app = Path("artifacts/jack-core/src/App.tsx")
          text = app.read_text()

          old_gate = '''  const canViewCloseout =\n    me?.isAdmin === false && !!ownedTelemetryContext?.scope?.pilotId;'''
          new_gate = '''  // Pilot is the primary product path during the active pilot. Telemetry\n  // participation is optional and must never determine access to Closeout.\n  // The Closeout API resolves and enforces active pilot membership server-side.\n  const canViewCloseout = me?.isAdmin === false;'''
          if text.count(old_gate) != 1:
              raise SystemExit(f"expected exactly one closeout gate, found {text.count(old_gate)}")
          text = text.replace(old_gate, new_gate)

          old_props = '''            participantName={me?.name || me?.email}\n            organizationName={ownedTelemetryContext?.scope?.organizationName}\n            pilotName={ownedTelemetryContext?.scope?.pilotName}\n            organizationId={ownedTelemetryContext?.scope?.organizationId}\n            pilotId={ownedTelemetryContext?.scope?.pilotId}\n'''
          new_props = '''            participantName={me?.name || me?.email}\n'''
          if text.count(old_props) != 1:
              raise SystemExit(f"expected exactly one telemetry-derived closeout prop block, found {text.count(old_props)}")
          text = text.replace(old_props, new_props)
          app.write_text(text)

          test = Path("artifacts/jack-core/src/App.closeout-primary.test.ts")
          test.write_text('''import { readFileSync } from "node:fs";\nimport { resolve } from "node:path";\nimport { describe, expect, it } from "vitest";\n\ndescribe("pilot-primary closeout architecture", () => {\n  const source = readFileSync(resolve(process.cwd(), "src/App.tsx"), "utf8");\n\n  it("does not gate participant Closeout on telemetry bootstrap", () => {\n    expect(source).toContain("const canViewCloseout = me?.isAdmin === false;");\n    expect(source).not.toContain("!!ownedTelemetryContext?.scope?.pilotId");\n    expect(source).toContain('view === "closeout" && canViewCloseout');\n  });\n\n  it("does not pass telemetry-derived scope into Closeout", () => {\n    const start = source.indexOf("<EndOfShiftCloseout");\n    const end = source.indexOf("/>", start);\n    expect(start).toBeGreaterThan(-1);\n    expect(end).toBeGreaterThan(start);\n    const closeoutBlock = source.slice(start, end);\n    expect(closeoutBlock).not.toContain("ownedTelemetryContext");\n    expect(closeoutBlock).toContain("participantId");\n  });\n});\n''')

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Focused regression
        run: pnpm --filter @workspace/jack-core exec vitest run src/App.closeout-primary.test.ts

      - name: Jack typecheck
        run: pnpm --filter @workspace/jack-core typecheck

      - name: Commit repair on existing PR branch
        run: |
          git config user.name "Torch Superintendent"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/jack-core/src/App.tsx artifacts/jack-core/src/App.closeout-primary.test.ts
          git diff --cached --check
          git commit -m "fix: make pilot closeout telemetry-independent"
          git push origin HEAD:fix/pilot002-auto-bootstrap-20260830
