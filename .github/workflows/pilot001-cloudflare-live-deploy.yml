name: Pilot001 Cloudflare Live Deploy

on:
  push:
    branches:
      - overclock/cloudflare-live-deploy-20260825-3
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PILOT_AUTH_BYPASS: "true"
  SUPABASE_URL: https://mdqdswhzkocglbnxvxth.supabase.co
  PILOT_001_ID: 394314ad-782b-4683-bc5d-65a0a3ba2552
  PILOT_001_ORGANIZATION_ID: 40817dd6-d2b8-4087-a6f2-f416500ab4e6
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Cloudflare deploy config
        run: node cloudflare/generate-deploy-config.mjs
      - name: Validate deployment lane before provider mutation
        shell: bash
        run: |
          node --check cloudflare/worker.mjs
          pnpm exec prettier --check \
            cloudflare/worker.mjs \
            cloudflare/generate-deploy-config.mjs \
            cloudflare/wrangler.base.json \
            .github/workflows/pilot001-cloudflare-live-deploy.yml
          npx --yes wrangler@latest deploy \
            --dry-run \
            --config cloudflare/wrangler.generated.json \
            --outdir .wrangler-live-dry-run
      - name: Preflight only non-derivable deployment secrets
        shell: bash
        run: |
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            SUPABASE_SERVICE_ROLE_KEY \
            OPENAI_API_KEY
          do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            printf 'MISSING_GITHUB_SECRETS=%s\n' "$(IFS=,; echo "${missing[*]}")"
            exit 2
          fi
          echo "Deployment secret preflight passed."
      - name: Verify Cloudflare account authentication
        run: npx --yes wrangler@latest whoami
      - name: Prepare ephemeral runtime secret file
        shell: bash
        run: |
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const names = ["SUPABASE_SERVICE_ROLE_KEY", "OPENAI_API_KEY"];
          const secrets = Object.fromEntries(names.map((name) => [name, process.env[name]]));
          writeFileSync("/tmp/jack-cloudflare-secrets.json", JSON.stringify(secrets), {
            mode: 0o600,
          });
          NODE
      - name: Deploy Worker + Container to workers.dev
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@latest deploy \
            --config cloudflare/wrangler.generated.json \
            --secrets-file /tmp/jack-cloudflare-secrets.json \
            --containers-rollout immediate \
            2>&1 | tee /tmp/wrangler-temporary-deploy.log
      - name: Resolve workers.dev URL
        id: url
        shell: bash
        run: |
          url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-temporary-deploy.log | tail -1 || true)
          if [ -z "$url" ]; then
            echo "Could not parse workers.dev URL from Wrangler output."
            cat /tmp/wrangler-temporary-deploy.log
            exit 3
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "WORKERS_DEV_URL=$url"
      - name: Temporary-host health and shell acceptance
        shell: bash
        env:
          WORKERS_DEV_URL: ${{ steps.url.outputs.url }}
        run: |
          for attempt in $(seq 1 36); do
            health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$WORKERS_DEV_URL/api/healthz" || true)
            root_code=$(curl -sS -o /tmp/root.html -w '%{http_code}' "$WORKERS_DEV_URL/" || true)
            if [ "$health_code" = "200" ] && [ "$root_code" = "200" ]; then
              echo "WORKERS_DEV_HEALTH=200"
              echo "WORKERS_DEV_ROOT=200"
              cat /tmp/health.json
              exit 0
            fi
            echo "acceptance attempt $attempt -> health=$health_code root=$root_code"
            sleep 5
          done
          echo "Temporary-host acceptance failed."
          cat /tmp/health.json 2>/dev/null || true
          exit 4
      - name: Seed Pilot001 site knowledge through embedding-backed path
        run: pnpm --filter @workspace/api-server run seed:knowledge
      - name: Verify Pilot001 knowledge IDs and embeddings
        shell: bash
        run: |
          node <<'NODE'
          const ids = Array.from({ length: 8 }, (_, index) => {
            const n = index + 6;
            const number = String(n).padStart(4, "0");
            const suffix = String(n).padStart(12, "0");
            return `e1e1e1e1-${number}-4001-8001-${suffix}`;
          });
          const params = new URLSearchParams({
            id: `in.(${ids.join(",")})`,
            select: "id,embedding",
          });
          const response = await fetch(`${process.env.SUPABASE_URL}/rest/v1/knowledge_entries?${params}`, {
            headers: {
              apikey: process.env.SUPABASE_SERVICE_ROLE_KEY,
              Authorization: `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}`,
            },
          });
          if (!response.ok) {
            throw new Error(`knowledge verification HTTP ${response.status}`);
          }
          const rows = await response.json();
          const embedded = new Set(
            rows.filter((row) => row.embedding !== null && row.embedding !== undefined).map((row) => row.id),
          );
          const missing = ids.filter((id) => !embedded.has(id));
          if (rows.length !== ids.length || missing.length > 0) {
            throw new Error(
              `Pilot001 knowledge verification failed: rows=${rows.length}/${ids.length}, embedded=${embedded.size}/${ids.length}, missing=${missing.join(",")}`,
            );
          }
          console.log(`PILOT001_KNOWLEDGE_ROWS=${rows.length}`);
          console.log(`PILOT001_EMBEDDED_ROWS=${embedded.size}`);
          NODE
      - name: Add Jack production custom domain
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const path = "cloudflare/wrangler.generated.json";
          const config = JSON.parse(readFileSync(path, "utf8"));
          config.routes = [{ pattern: "jack.torchlabs.ca", custom_domain: true }];
          writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          set -o pipefail
          npx --yes wrangler@latest deploy \
            --config cloudflare/wrangler.generated.json \
            --secrets-file /tmp/jack-cloudflare-secrets.json \
            --containers-rollout none \
            2>&1 | tee /tmp/wrangler-production-bind.log
      - name: Production hostname acceptance
        shell: bash
        run: |
          for attempt in $(seq 1 36); do
            health_code=$(curl -sS -o /tmp/prod-health.json -w '%{http_code}' https://jack.torchlabs.ca/api/healthz || true)
            root_code=$(curl -sS -o /tmp/prod-root.html -w '%{http_code}' https://jack.torchlabs.ca/ || true)
            if [ "$health_code" = "200" ] && [ "$root_code" = "200" ]; then
              echo "PRODUCTION_HEALTH=200"
              echo "PRODUCTION_ROOT=200"
              cat /tmp/prod-health.json
              exit 0
            fi
            echo "production attempt $attempt -> health=$health_code root=$root_code"
            sleep 5
          done
          echo "Production hostname acceptance failed."
          cat /tmp/prod-health.json 2>/dev/null || true
          exit 5
      - name: Remove ephemeral runtime secret file
        if: always()
        shell: bash
        run: rm -f /tmp/jack-cloudflare-secrets.json
