name: Inspect Jack Production Routing

on:
  push:
    branches:
      - ops/live-ui-smoke-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  inspect-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Inspect public response and Cloudflare binding
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import dns from 'node:dns/promises';

          const host = 'jack.torchlabs.ca';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('CLOUDFLARE_API_TOKEN is unavailable');

          const safeHeaders = (headers) => Object.fromEntries(
            [...headers.entries()].filter(([name]) => [
              'server', 'via', 'location', 'content-type', 'content-security-policy',
              'cf-ray', 'cf-cache-status', 'x-powered-by', 'x-railway-edge',
              'x-railway-request-id', 'x-served-by', 'x-vercel-id'
            ].includes(name.toLowerCase()))
          );

          for (const path of ['/', '/sign-in', '/api/healthz']) {
            const response = await fetch(`https://${host}${path}`, { redirect: 'manual' });
            const text = await response.text();
            console.log(JSON.stringify({
              request: path,
              status: response.status,
              headers: safeHeaders(response.headers),
              title: text.match(/<title>([^<]*)<\/title>/i)?.[1] ?? null,
              looksLikeJack: /Starting Jack|Welcome back|Journeyman Agentic Construction Knowledge/i.test(text),
              looksLikeTorchApp: /Field Mentorship MVP|BUILT FOR THE PEOPLE LEARNING ON THE JOB/i.test(text),
              bodyPrefix: text.slice(0, 180).replace(/\s+/g, ' '),
            }, null, 2));
          }

          for (const recordType of ['CNAME', 'A', 'AAAA']) {
            try {
              console.log(`${recordType}: ${JSON.stringify(await dns.resolve(host, recordType))}`);
            } catch (error) {
              console.log(`${recordType}: ${error.code ?? error.message}`);
            }
          }

          const api = async (path) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            });
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              console.log(JSON.stringify({ path, status: response.status, errors: payload.errors ?? [] }, null, 2));
              return null;
            }
            return payload.result;
          };

          const zones = await api('/zones?name=torchlabs.ca&status=active&per_page=50');
          if (!Array.isArray(zones) || zones.length !== 1) {
            throw new Error(`Expected one active torchlabs.ca zone, found ${Array.isArray(zones) ? zones.length : 'unavailable'}`);
          }
          const zone = zones[0];
          console.log(JSON.stringify({ zone: { id: zone.id, name: zone.name, status: zone.status } }, null, 2));

          const records = await api(`/zones/${zone.id}/dns_records?name=${host}&per_page=100`);
          console.log(JSON.stringify({ dnsRecords: (records ?? []).map((record) => ({
            id: record.id,
            type: record.type,
            name: record.name,
            content: record.content,
            proxied: record.proxied,
            ttl: record.ttl,
            comment: record.comment ?? null,
            modified_on: record.modified_on,
          })) }, null, 2));

          const routes = await api(`/zones/${zone.id}/workers/routes`);
          console.log(JSON.stringify({ workerRoutes: (routes ?? []).map((route) => ({
            id: route.id,
            pattern: route.pattern,
            script: route.script ?? null,
          })) }, null, 2));

          const rulesets = await api(`/zones/${zone.id}/rulesets`);
          console.log(JSON.stringify({ rulesets: (rulesets ?? []).map((ruleset) => ({
            id: ruleset.id,
            name: ruleset.name,
            phase: ruleset.phase,
            kind: ruleset.kind,
          })) }, null, 2));
          NODE
