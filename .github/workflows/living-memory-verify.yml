name: Living Memory Verification

on:
  push:
    branches:
      - hotfix/living-memory-trust-gate
  pull_request:
    branches:
      - main
    paths:
      - "artifacts/api-server/src/routes/graph.ts"
      - "artifacts/api-server/src/lib/public-memory-graph.ts"
      - "artifacts/api-server/src/lib/__tests__/public-memory-graph.test.ts"
      - "artifacts/jack-core/src/lib/memory-graph.ts"
      - "artifacts/jack-core/src/lib/use-memory-graph.ts"
      - "artifacts/jack-core/src/components/MemoryGraphView.tsx"
      - ".github/workflows/living-memory-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diagnose exact Prettier output
        run: |
          pnpm exec prettier --write artifacts/api-server/src/routes/graph.ts artifacts/api-server/src/lib/public-memory-graph.ts artifacts/api-server/src/lib/__tests__/public-memory-graph.test.ts .github/workflows/living-memory-verify.yml
          git diff -- artifacts/api-server/src/routes/graph.ts artifacts/api-server/src/lib/public-memory-graph.ts artifacts/api-server/src/lib/__tests__/public-memory-graph.test.ts .github/workflows/living-memory-verify.yml
          exit 1
