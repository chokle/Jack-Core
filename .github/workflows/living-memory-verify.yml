name: Living Memory Verification

on:
  push:
    branches:
      - hotfix/living-memory-trust-gate

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture formatted test
        run: |
          pnpm exec prettier --write artifacts/api-server/src/lib/__tests__/public-memory-graph.test.ts
          printf 'FORMATTED_TEST_BASE64='
          base64 -w0 artifacts/api-server/src/lib/__tests__/public-memory-graph.test.ts
          printf '\n'
          exit 1
