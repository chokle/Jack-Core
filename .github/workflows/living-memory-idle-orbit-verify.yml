name: Living Memory Idle Orbit Verify

on:
  push:
    branches:
      - ui/living-memory-idle-orbit-20260830b

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[idle-orbit-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply idle auto-orbit
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('artifacts/jack-core/src/components/SpatialBrainCanvas.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected 1 match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'const ORBIT_SPEED = 0.006;\nconst BIRTH_MS = 1600;\n',
              'const ORBIT_SPEED = 0.006;\nconst IDLE_ORBIT_DELAY_MS = 30_000;\nconst IDLE_ORBIT_STEP = 0.0008;\nconst BIRTH_MS = 1600;\n',
          )

          replace_once(
              '''      let pressPointerType = "mouse";\n      let pinchDist = 0;\n\n      const onPointerDown = (e: PointerEvent) => {\n''',
              '''      let pressPointerType = "mouse";\n      let pinchDist = 0;\n      let lastInteractionAt = performance.now();\n      const markInteraction = () => {\n        lastInteractionAt = performance.now();\n      };\n\n      const onPointerDown = (e: PointerEvent) => {\n''',
          )

          replace_once(
              '''      const onPointerDown = (e: PointerEvent) => {\n        if (locked) return;\n        // A manual grab cancels any in-flight camera swing.\n''',
              '''      const onPointerDown = (e: PointerEvent) => {\n        if (locked) return;\n        markInteraction();\n        // A manual grab cancels any in-flight camera swing.\n''',
          )

          replace_once(
              '''        if (dragging && !locked) {\n          const dx = p.x - last.x;\n''',
              '''        if (dragging && !locked) {\n          markInteraction();\n          const dx = p.x - last.x;\n''',
          )

          replace_once(
              '''      const onPointerUp = (e: PointerEvent) => {\n        const wasDragging = dragging;\n''',
              '''      const onPointerUp = (e: PointerEvent) => {\n        markInteraction();\n        const wasDragging = dragging;\n''',
          )

          replace_once(
              '''      const onWheel = (e: WheelEvent) => {\n        if (locked) return;\n        e.preventDefault();\n''',
              '''      const onWheel = (e: WheelEvent) => {\n        if (locked) return;\n        markInteraction();\n        e.preventDefault();\n''',
          )

          replace_once(
              '''        if (!document.hidden) {\n          // Ease an in-flight camera swing (focusNode / ensureVisible) toward its\n''',
              '''        if (!document.hidden) {\n          const cam = camRef.current;\n          const idleOrbitActive =\n            !lockedRef.current &&\n            !reducedRef.current &&\n            pointers.size === 0 &&\n            !dragging &&\n            camTargetRef.current === null &&\n            t - lastInteractionAt >= IDLE_ORBIT_DELAY_MS;\n          if (idleOrbitActive) {\n            cam.yaw += IDLE_ORBIT_STEP * dt;\n          }\n\n          // Ease an in-flight camera swing (focusNode / ensureVisible) toward its\n''',
          )

          path.write_text(text, encoding='utf-8')
          PY
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm exec prettier --write artifacts/jack-core/src/components/SpatialBrainCanvas.tsx
      - name: Jack tests
        run: pnpm --filter @workspace/jack-core test
      - name: Typecheck
        run: pnpm typecheck
      - name: Jack build
        run: pnpm --filter @workspace/jack-core build
      - name: Diff check
        run: git diff --check
      - name: Commit verified change
        shell: bash
        run: |
          rm .github/workflows/living-memory-idle-orbit-verify.yml
          git config user.name "daz-ui"
          git config user.email "24825492+chokle@users.noreply.github.com"
          git add -A
          git commit -m "Add Living Memory idle auto-orbit [idle-orbit-applied]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
