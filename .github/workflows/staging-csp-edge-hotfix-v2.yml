name: Staging CSP Edge Hotfix v2

on:
  push:
    branches:
      - ops/live-ui-smoke-20260828
    paths:
      - ".github/workflows/staging-csp-edge-hotfix-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ZONE_NAME: torchlabs.ca
  STAGING_HOST: staging.jack.torchlabs.ca
  ORIGIN_ALIAS: staging-origin.jack.torchlabs.ca
  RAILWAY_TARGET: h3r6mycb.up.railway.app
  WORKER_NAME: jack-staging-csp-hotfix
  ROUTE_PATTERN: staging.jack.torchlabs.ca/*

jobs:
  deploy-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Worker source
        run: node --check cloudflare/staging-csp-hotfix.mjs

      - name: Capture state and create DNS-only Railway origin alias
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('Missing CLOUDFLARE_API_TOKEN');

          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(options.headers ?? {}) },
            });
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              throw new Error(`${options.method ?? 'GET'} ${path} failed: ${response.status} ${JSON.stringify(payload.errors ?? [])}`);
            }
            return payload.result;
          }

          const zones = await cf(`/zones?name=${process.env.ZONE_NAME}&status=active&per_page=50`);
          if (!Array.isArray(zones) || zones.length !== 1) throw new Error('Active Torch zone was not uniquely resolved');
          const zone = zones[0];
          if (!Array.isArray(zone.name_servers) || !zone.name_servers.length) throw new Error('Authoritative nameservers were not returned');

          const records = await cf(`/zones/${zone.id}/dns_records?type=CNAME&name=${process.env.STAGING_HOST}&per_page=100`);
          if (!Array.isArray(records) || records.length !== 1) throw new Error(`Expected one staging CNAME; found ${records?.length ?? 0}`);
          const record = records[0];
          if (String(record.content).toLowerCase() !== process.env.RAILWAY_TARGET) throw new Error(`Unexpected staging origin ${record.content}`);

          const routes = await cf(`/zones/${zone.id}/workers/routes`);
          const matchingRoute = (routes ?? []).find((route) => route.pattern === process.env.ROUTE_PATTERN) ?? null;
          if (matchingRoute && matchingRoute.script && matchingRoute.script !== process.env.WORKER_NAME) {
            throw new Error(`Staging route belongs to another Worker: ${matchingRoute.script}`);
          }

          const aliasRecords = await cf(`/zones/${zone.id}/dns_records?name=${process.env.ORIGIN_ALIAS}&per_page=100`);
          if (Array.isArray(aliasRecords) && aliasRecords.length > 1) throw new Error('Multiple staging origin aliases exist');
          let alias = Array.isArray(aliasRecords) ? aliasRecords[0] : null;
          let aliasCreated = false;
          if (alias) {
            if (alias.type !== 'CNAME' || String(alias.content).toLowerCase() !== process.env.RAILWAY_TARGET || alias.proxied !== false) {
              throw new Error('Existing origin alias conflicts with the verified Railway origin');
            }
          } else {
            alias = await cf(`/zones/${zone.id}/dns_records`, {
              method: 'POST',
              body: JSON.stringify({
                type: 'CNAME',
                name: process.env.ORIGIN_ALIAS,
                content: process.env.RAILWAY_TARGET,
                proxied: false,
                ttl: 1,
                comment: 'Temporary resolveOverride alias for staging CSP recovery 2026-08-28',
              }),
            });
            aliasCreated = true;
          }

          const state = {
            accountId: zone.account?.id,
            zoneId: zone.id,
            zoneType: zone.type,
            nameservers: zone.name_servers,
            record: { id: record.id, type: record.type, name: record.name, content: record.content, proxied: record.proxied, ttl: record.ttl, comment: record.comment ?? null },
            aliasId: alias.id,
            aliasCreated,
            routeId: matchingRoute?.id ?? null,
            routeCreated: false,
            workerDeployed: false,
            dnsChanged: false,
          };
          if (!state.accountId) throw new Error('Cloudflare account ID missing');
          fs.writeFileSync('/tmp/staging-edge-v2-state.json', JSON.stringify(state, null, 2));
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ACCOUNT_ID=${state.accountId}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ZONE_ID=${state.zoneId}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `AUTHORITATIVE_NS=${state.nameservers[0]}\n`);
          console.log(JSON.stringify({ zoneType: state.zoneType, nameservers: state.nameservers, stagingRecord: state.record, aliasCreated }, null, 2));
          NODE

      - name: Deploy isolated edge Worker
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.staging-hotfix-v2.json <<EOF
          {
            "name": "$WORKER_NAME",
            "main": "./staging-csp-hotfix.mjs",
            "compatibility_date": "2026-08-28",
            "account_id": "$CLOUDFLARE_ACCOUNT_ID",
            "workers_dev": false,
            "observability": { "enabled": true }
          }
          EOF
          npx --yes wrangler@latest whoami
          npx --yes wrangler@latest deploy --config wrangler.staging-hotfix-v2.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = '/tmp/staging-edge-v2-state.json';
          const state = JSON.parse(fs.readFileSync(p, 'utf8'));
          state.workerDeployed = true;
          fs.writeFileSync(p, JSON.stringify(state, null, 2));
          NODE

      - name: Attach route and enable Cloudflare proxy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = '/tmp/staging-edge-v2-state.json';
          const state = JSON.parse(fs.readFileSync(p, 'utf8'));
          const token = process.env.CLOUDFLARE_API_TOKEN;
          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(options.headers ?? {}) },
            });
            const payload = await response.json();
            if (!response.ok || payload.success === false) throw new Error(`${options.method ?? 'GET'} ${path} failed: ${response.status} ${JSON.stringify(payload.errors ?? [])}`);
            return payload.result;
          }
          if (!state.routeId) {
            const route = await cf(`/zones/${state.zoneId}/workers/routes`, {
              method: 'POST',
              body: JSON.stringify({ pattern: process.env.ROUTE_PATTERN, script: process.env.WORKER_NAME }),
            });
            state.routeId = route.id;
            state.routeCreated = true;
            fs.writeFileSync(p, JSON.stringify(state, null, 2));
          }
          const updated = await cf(`/zones/${state.zoneId}/dns_records/${state.record.id}`, {
            method: 'PATCH',
            body: JSON.stringify({
              type: 'CNAME', name: process.env.STAGING_HOST, content: process.env.RAILWAY_TARGET,
              proxied: true, ttl: 1, comment: 'Cloudflare edge enabled for staging CSP repair 2026-08-28',
            }),
          });
          state.dnsChanged = true;
          fs.writeFileSync(p, JSON.stringify(state, null, 2));
          console.log(JSON.stringify({ routeId: state.routeId, proxied: updated.proxied }, null, 2));
          NODE

      - name: Resolve staging from Cloudflare authoritative DNS
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dig >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dnsutils
          fi
          AUTHORITATIVE_IP="$(dig +short "$AUTHORITATIVE_NS" A | head -n1)"
          test -n "$AUTHORITATIVE_IP"
          echo "Authoritative NS: $AUTHORITATIVE_NS ($AUTHORITATIVE_IP)"

          EDGE_IP=""
          for attempt in $(seq 1 60); do
            mapfile -t answers < <(dig +short @"$AUTHORITATIVE_IP" "$STAGING_HOST" A | grep -E '^[0-9]+(\.[0-9]+){3}$' || true)
            echo "attempt=$attempt authoritative_answers=${answers[*]:-none}"
            for ip in "${answers[@]}"; do
              header="$(curl --silent --show-error --location --max-time 15 --resolve "$STAGING_HOST:443:$ip" --dump-header - --output /dev/null "https://$STAGING_HOST/api/healthz?authoritative_probe=$(date +%s%N)" || true)"
              if grep -Eqi '^x-jack-staging-csp-hotfix:[[:space:]]*2026-08-28' <<<"$header"; then
                EDGE_IP="$ip"
                break 2
              fi
            done
            sleep 3
          done
          if [ -z "$EDGE_IP" ]; then
            echo "Cloudflare authoritative DNS never produced an edge path executing the Worker." >&2
            exit 1
          fi
          echo "CLOUDFLARE_EDGE_IP=$EDGE_IP" >> "$GITHUB_ENV"
          echo "Verified Worker execution through Cloudflare edge $EDGE_IP"

      - name: Accept root, health, and both CSP layers through verified edge IP
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(date +%s%N)"
          curl --silent --show-error --location --resolve "$STAGING_HOST:443:$CLOUDFLARE_EDGE_IP" \
            --dump-header /tmp/v2-root-headers.txt --output /tmp/v2-root.html \
            "https://$STAGING_HOST/?edge_acceptance=$nonce"
          curl --silent --show-error --location --resolve "$STAGING_HOST:443:$CLOUDFLARE_EDGE_IP" \
            --dump-header /tmp/v2-health-headers.txt --output /tmp/v2-health.json \
            "https://$STAGING_HOST/api/healthz?edge_acceptance=$nonce"

          grep -Eqi '^x-jack-staging-csp-hotfix:[[:space:]]*2026-08-28' /tmp/v2-root-headers.txt
          grep -Eqi '^content-security-policy:.*https://clerk\.staging\.jack\.torchlabs\.ca' /tmp/v2-root-headers.txt
          grep -Eqi '<meta http-equiv="Content-Security-Policy" content="[^"]*https://clerk\.staging\.jack\.torchlabs\.ca' /tmp/v2-root.html
          grep -Eqi 'Jack — AI Trade Intelligence Engine|application-name[^>]+content="Jack"' /tmp/v2-root.html
          grep -Eqi '^x-jack-staging-csp-hotfix:[[:space:]]*2026-08-28' /tmp/v2-health-headers.txt
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/v2-health.json
          echo "AUTHORITATIVE_EDGE_ROOT_HEALTH_AND_BOTH_CSP_LAYERS_ACCEPTED"

      - name: Install mobile browser diagnostic
        shell: bash
        run: |
          mkdir -p /tmp/jack-staging-edge-v2
          cd /tmp/jack-staging-edge-v2
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run strict mobile Clerk acceptance through verified Cloudflare edge
        shell: bash
        run: |
          cd /tmp/jack-staging-edge-v2
          cat > smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          (async () => {
            const origin = 'https://staging.jack.torchlabs.ca';
            const clerkOrigin = 'https://clerk.staging.jack.torchlabs.ca';
            const edgeIp = process.env.CLOUDFLARE_EDGE_IP;
            const browser = await chromium.launch({
              headless: true,
              args: [`--host-resolver-rules=MAP staging.jack.torchlabs.ca ${edgeIp},EXCLUDE localhost`],
            });
            const context = await browser.newContext({ viewport: { width: 430, height: 932 }, userAgent: 'Jack-Staging-Edge-V2/2026-08-28' });
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];
            const clerkResponses = [];
            const page = await context.newPage();
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            page.on('requestfailed', (request) => failedRequests.push({ url: request.url(), error: request.failure()?.errorText ?? 'unknown' }));
            page.on('response', (response) => {
              if (response.url().startsWith(`${clerkOrigin}/v1/`)) clerkResponses.push({ url: response.url(), status: response.status() });
            });

            const response = await page.goto(`${origin}/sign-in?edge_v2=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(8000);
            const metaPolicy = await page.locator('meta[http-equiv="Content-Security-Policy"]').getAttribute('content');
            const result = {
              checkedAt: new Date().toISOString(),
              edgeIp,
              signIn: {
                status: response?.status() ?? null,
                url: page.url(), title: await page.title(),
                body: (await page.locator('body').innerText()).slice(0, 2000),
                welcomeBack: await page.getByText('Welcome back', { exact: true }).count(),
                emailInputs: await page.locator('input[type="email"], input[name="identifier"]').count(),
                startingJack: await page.getByText('Starting Jack…', { exact: true }).count(),
                authUnavailable: await page.getByText('Sign-in is temporarily unavailable', { exact: true }).count(),
                visibleBlurOverlays: await page.locator('[class*="backdrop-blur"]:visible').count(),
                metaPolicyHasStagingClerk: String(metaPolicy).includes(clerkOrigin),
              },
              clerkResponses, pageErrors, consoleErrors, failedRequests,
            };
            await page.screenshot({ path: 'staging-edge-v2-sign-in.png', fullPage: true });
            const health = await context.request.get(`${origin}/api/healthz?edge_v2=${Date.now()}`, { timeout: 30000 });
            result.health = { status: health.status(), body: await health.text(), hotfixHeader: health.headers()['x-jack-staging-csp-hotfix'] ?? null };
            fs.writeFileSync('staging-edge-v2-result.json', JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));

            const fatal = [];
            if (result.signIn.status !== 200) fatal.push(`sign-in status ${result.signIn.status}`);
            if (result.signIn.startingJack || result.signIn.authUnavailable) fatal.push('startup/auth blocker remained');
            if (!result.signIn.welcomeBack || !result.signIn.emailInputs) fatal.push('sign-in form did not render');
            if (result.signIn.visibleBlurOverlays) fatal.push('visible blur overlay remained');
            if (!result.signIn.metaPolicyHasStagingClerk) fatal.push('HTML CSP was not rewritten');
            if (!clerkResponses.some((r) => r.url.includes('/v1/environment') && r.status < 400)) fatal.push('Clerk environment request failed');
            if (!clerkResponses.some((r) => r.url.includes('/v1/client') && r.status < 400)) fatal.push('Clerk client request failed');
            if (result.health.status !== 200 || !result.health.body.includes('"status":"ok"') || result.health.hotfixHeader !== '2026-08-28') fatal.push('edge health acceptance failed');
            if (pageErrors.length) fatal.push(`${pageErrors.length} page error(s)`);
            if (consoleErrors.length) fatal.push(`${consoleErrors.length} console error(s)`);
            if (failedRequests.length) fatal.push(`${failedRequests.length} failed request(s)`);
            await browser.close();
            if (fatal.length) { console.error(`STAGING_EDGE_V2_FAILED: ${fatal.join('; ')}`); process.exit(1); }
            console.log('STAGING_EDGE_V2_PASSED_STRICT');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node smoke.cjs

      - name: Wait for normal public DNS path to converge
        shell: bash
        run: |
          set -euo pipefail
          accepted="false"
          for attempt in $(seq 1 100); do
            nonce="$(date +%s%N)"
            curl --silent --show-error --location --max-time 20 --dump-header /tmp/v2-public-headers.txt --output /tmp/v2-public-health.json \
              "https://$STAGING_HOST/api/healthz?public_convergence=$nonce" || true
            if grep -Eqi '^x-jack-staging-csp-hotfix:[[:space:]]*2026-08-28' /tmp/v2-public-headers.txt \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/v2-public-health.json; then
              accepted="true"
              break
            fi
            echo "attempt=$attempt waiting for public resolver convergence"
            sleep 3
          done
          if [ "$accepted" != "true" ]; then
            echo "Verified authoritative Cloudflare edge is healthy, but this runner's cached public resolver did not converge before timeout." >&2
            exit 1
          fi
          echo "STAGING_PUBLIC_DNS_CONVERGED"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-csp-edge-v2-evidence
          path: |
            /tmp/jack-staging-edge-v2/staging-edge-v2-result.json
            /tmp/jack-staging-edge-v2/staging-edge-v2-sign-in.png
            /tmp/v2-root-headers.txt
            /tmp/v2-root.html
            /tmp/v2-health.json
            /tmp/v2-public-headers.txt
            /tmp/v2-public-health.json
          if-no-files-found: warn
          retention-days: 3

      - name: Record verified recovery
        if: success()
        run: |
          {
            echo "## Jack staging recovery"
            echo "- Railway origin: PASS"
            echo "- Cloudflare authoritative edge: PASS"
            echo "- HTTP and HTML CSP rewrite: PASS"
            echo "- Clerk environment/client: PASS"
            echo "- mobile sign-in, no blur: PASS"
            echo "- health: PASS"
            echo "- public DNS convergence: PASS"
            echo "- production: UNCHANGED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back every edge mutation if any gate fails
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = '/tmp/staging-edge-v2-state.json';
          if (!fs.existsSync(p)) { console.log('No Cloudflare mutation state recorded.'); process.exit(0); }
          const state = JSON.parse(fs.readFileSync(p, 'utf8'));
          const token = process.env.CLOUDFLARE_API_TOKEN;
          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(options.headers ?? {}) },
            });
            let payload = null;
            try { payload = await response.json(); } catch {}
            if (!response.ok || payload?.success === false) throw new Error(`${options.method ?? 'GET'} ${path} rollback failed: ${response.status} ${JSON.stringify(payload?.errors ?? [])}`);
            return payload?.result;
          }
          if (state.dnsChanged) {
            await cf(`/zones/${state.zoneId}/dns_records/${state.record.id}`, {
              method: 'PATCH',
              body: JSON.stringify({ type: state.record.type, name: state.record.name, content: state.record.content, proxied: state.record.proxied, ttl: state.record.ttl, comment: state.record.comment }),
            });
            console.log('Restored original staging DNS.');
          }
          if (state.routeCreated && state.routeId) { await cf(`/zones/${state.zoneId}/workers/routes/${state.routeId}`, { method: 'DELETE' }); console.log('Removed temporary Worker route.'); }
          if (state.workerDeployed && state.accountId) { await cf(`/accounts/${state.accountId}/workers/scripts/${process.env.WORKER_NAME}`, { method: 'DELETE' }); console.log('Removed temporary Worker script.'); }
          if (state.aliasCreated && state.aliasId) { await cf(`/zones/${state.zoneId}/dns_records/${state.aliasId}`, { method: 'DELETE' }); console.log('Removed temporary origin alias.'); }
          console.log('STAGING_EDGE_V2_ROLLED_BACK');
          NODE
