name: Stable Production Edge Acceptance

on:
  push:
    branches:
      - ops/stable-edge-recovery-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  JACK_HOST: jack.torchlabs.ca
  RAILWAY_TARGET: 065w3uja.up.railway.app
  EDGE_SCRIPT: jack-production-csp-stable-20260828

jobs:
  deploy-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Deploy stable CSP Worker and bind production route
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const host = process.env.JACK_HOST;
          const railwayTarget = process.env.RAILWAY_TARGET;
          const scriptName = process.env.EDGE_SCRIPT;
          if (!token) throw new Error('CLOUDFLARE_API_TOKEN is unavailable');

          async function cf(path, options = {}) {
            const headers = { Authorization: `Bearer ${token}`, ...(options.headers ?? {}) };
            if (!(options.body instanceof FormData)) headers['Content-Type'] = 'application/json';
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { ...options, headers });
            const text = await response.text();
            let payload;
            try { payload = JSON.parse(text); } catch { payload = { success: response.ok, result: text }; }
            if (!response.ok || payload.success === false) {
              throw new Error(`${options.method ?? 'GET'} ${path}: ${response.status} ${JSON.stringify(payload.errors ?? payload)}`);
            }
            return payload.result;
          }

          const zones = await cf('/zones?name=torchlabs.ca&status=active&per_page=50');
          if (!Array.isArray(zones) || zones.length !== 1) throw new Error('Active torchlabs.ca zone was not uniquely resolved');
          const zone = zones[0];
          const records = await cf(`/zones/${zone.id}/dns_records?type=CNAME&name=${host}&per_page=100`);
          if (!Array.isArray(records) || records.length !== 1) throw new Error(`Expected one ${host} CNAME; found ${records?.length ?? 0}`);
          const record = records[0];
          if (String(record.content).toLowerCase() !== railwayTarget) throw new Error(`Unexpected production origin ${record.content}`);

          const workerSource = `
          const REQUIRED = {
            'script-src': ['https://clerk.torchlabs.ca', 'https://static.cloudflareinsights.com'],
            'connect-src': ['https://clerk.torchlabs.ca', 'https://cloudflareinsights.com', 'https://static.cloudflareinsights.com'],
            'frame-src': ['https://clerk.torchlabs.ca']
          };
          function patchPolicy(value) {
            if (!value) return value;
            const directives = value.split(';').map((part) => part.trim()).filter(Boolean);
            const map = new Map(directives.map((directive) => [directive.split(/\\s+/, 1)[0], directive]));
            for (const [name, sources] of Object.entries(REQUIRED)) {
              const current = map.get(name) || name;
              const tokens = new Set(current.split(/\\s+/));
              map.set(name, current + sources.filter((source) => !tokens.has(source)).map((source) => ' ' + source).join(''));
            }
            const seen = new Set();
            const output = directives.map((directive) => {
              const name = directive.split(/\\s+/, 1)[0];
              seen.add(name);
              return map.get(name) || directive;
            });
            for (const name of Object.keys(REQUIRED)) if (!seen.has(name)) output.push(map.get(name));
            return output.join('; ');
          }
          export default {
            async fetch(request) {
              const upstream = await fetch(request);
              const response = new Response(upstream.body, upstream);
              const policy = response.headers.get('Content-Security-Policy');
              if (policy) response.headers.set('Content-Security-Policy', patchPolicy(policy));
              response.headers.set('X-Jack-Edge-Recovery', 'clerk-csp-stable-20260828');
              const type = response.headers.get('Content-Type') || '';
              if (!type.toLowerCase().includes('text/html')) return response;
              return new HTMLRewriter()
                .on('meta[http-equiv="Content-Security-Policy"]', {
                  element(element) {
                    const content = element.getAttribute('content');
                    if (content) element.setAttribute('content', patchPolicy(content));
                  }
                })
                .transform(response);
            }
          };
          `;

          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify({ main_module: 'worker.mjs', compatibility_date: '2026-08-28', bindings: [] })], { type: 'application/json' }), 'metadata.json');
          form.append('worker.mjs', new Blob([workerSource], { type: 'application/javascript+module' }), 'worker.mjs');
          await cf(`/accounts/${zone.account.id}/workers/scripts/${scriptName}`, { method: 'PUT', body: form });

          const routes = await cf(`/zones/${zone.id}/workers/routes`);
          const pattern = `${host}/*`;
          const route = (routes ?? []).find((item) => item.pattern === pattern);
          if (route) {
            await cf(`/zones/${zone.id}/workers/routes/${route.id}`, { method: 'PUT', body: JSON.stringify({ pattern, script: scriptName }) });
          } else {
            await cf(`/zones/${zone.id}/workers/routes`, { method: 'POST', body: JSON.stringify({ pattern, script: scriptName }) });
          }

          if (record.proxied !== true) {
            await cf(`/zones/${zone.id}/dns_records/${record.id}`, {
              method: 'PATCH',
              body: JSON.stringify({ type: 'CNAME', name: host, content: railwayTarget, proxied: true, ttl: 1, comment: 'Stable Jack CSP recovery for Pilot001, 2026-08-28' }),
            });
          }

          const afterRoutes = await cf(`/zones/${zone.id}/workers/routes`);
          const bound = (afterRoutes ?? []).find((item) => item.pattern === pattern);
          if (!bound || bound.script !== scriptName) throw new Error(`Route binding failed: ${JSON.stringify(bound)}`);
          console.log(JSON.stringify({ zone: zone.id, dns: { content: railwayTarget, proxied: true }, route: bound }, null, 2));
          NODE

      - name: Wait for stable edge marker and healthy Jack
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          for attempt in $(seq 1 36); do
            curl --silent --show-error --location --dump-header /tmp/headers.txt --output /tmp/root.html -H 'Cache-Control: no-cache' "https://$JACK_HOST/?stable_edge=$(date +%s%N)" || true
            health_code="$(curl --silent --show-error --location --output /tmp/health.json --write-out '%{http_code}' -H 'Cache-Control: no-cache' "https://$JACK_HOST/api/healthz?stable_edge=$(date +%s%N)" || true)"
            marker="$(awk 'BEGIN{IGNORECASE=1} /^x-jack-edge-recovery:/{gsub(/\r/,""); print $2}' /tmp/headers.txt | tail -1)"
            if [ "$marker" = "clerk-csp-stable-20260828" ] \
              && grep -Eqi '^content-security-policy:.*https://clerk\.torchlabs\.ca' /tmp/headers.txt \
              && grep -Eqi '^content-security-policy:.*https://static\.cloudflareinsights\.com' /tmp/headers.txt \
              && grep -Eqi '^content-security-policy:.*https://cloudflareinsights\.com' /tmp/headers.txt \
              && grep -Eqi 'Jack — AI Trade Intelligence Engine|application-name[^>]+content="Jack"' /tmp/root.html \
              && [ "$health_code" = "200" ] \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json; then
              accepted=true
              echo "Stable edge accepted on attempt $attempt"
              break
            fi
            echo "attempt=$attempt marker=${marker:-none} health=$health_code"
            sleep 4
          done
          test "$accepted" = true

      - name: Install mobile browser runner
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          mkdir -p /tmp/jack-stable-acceptance
          cd /tmp/jack-stable-acceptance
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0

      - name: Run strict production mobile acceptance
        shell: bash
        run: |
          cd /tmp/jack-stable-acceptance
          cat > acceptance.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('node:fs');
          (async () => {
            const origin = 'https://jack.torchlabs.ca';
            const browser = await chromium.launch({ headless: true, executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            const context = await browser.newContext({ viewport: { width: 430, height: 932 }, userAgent: 'Jack-Pilot-Stable-Acceptance/2026-08-28' });
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];
            const clerkResponses = [];
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            page.on('requestfailed', (request) => failedRequests.push({ url: request.url(), error: request.failure()?.errorText ?? 'unknown' }));
            page.on('response', (response) => { if (/clerk/i.test(response.url())) clerkResponses.push({ url: response.url(), status: response.status() }); });

            const signInResponse = await page.goto(`${origin}/sign-in?stable_acceptance=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(10000);
            const body = (await page.locator('body').innerText()).slice(0, 4000);
            const result = {
              checkedAt: new Date().toISOString(),
              signIn: {
                status: signInResponse?.status() ?? null,
                url: page.url(),
                title: await page.title(),
                body,
                emailInputs: await page.locator('input[type="email"], input[name="identifier"]').count(),
                continueButtons: await page.getByRole('button', { name: /continue/i }).count(),
                pilotAccessCopy: /Pilot participant access/i.test(body),
                startingJack: await page.getByText('Starting Jack…', { exact: true }).count(),
                authUnavailable: await page.getByText('Sign-in is temporarily unavailable', { exact: true }).count(),
                visibleBlurOverlays: await page.locator('[class*="backdrop-blur"]:visible').count(),
              },
              root: {}, health: {}, edge: {}, pageErrors, consoleErrors, failedRequests, clerkResponses,
            };
            await page.screenshot({ path: 'stable-sign-in.png', fullPage: true });

            const rootResponse = await page.goto(`${origin}/?stable_acceptance=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(4000);
            result.root = { status: rootResponse?.status() ?? null, title: await page.title(), url: page.url() };
            await page.screenshot({ path: 'stable-root.png', fullPage: true });

            const healthResponse = await context.request.get(`${origin}/api/healthz?stable_acceptance=${Date.now()}`, { timeout: 30000 });
            result.health = { status: healthResponse.status(), body: (await healthResponse.text()).slice(0, 1000) };
            const edgeResponse = await context.request.get(`${origin}/?stable_header=${Date.now()}`, { timeout: 30000 });
            result.edge = { status: edgeResponse.status(), recovery: edgeResponse.headers()['x-jack-edge-recovery'] ?? null, csp: edgeResponse.headers()['content-security-policy'] ?? null };
            fs.writeFileSync('stable-result.json', JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));

            const fatal = [];
            if (result.signIn.status !== 200 || !result.signIn.title.includes('Jack')) fatal.push('Jack sign-in shell failed');
            if (result.signIn.emailInputs < 1 || result.signIn.continueButtons < 1) fatal.push('Clerk first-step form did not render');
            if (!result.signIn.pilotAccessCopy) fatal.push('pilot access screen did not render');
            if (result.signIn.startingJack > 0 || result.signIn.authUnavailable > 0 || result.signIn.visibleBlurOverlays > 0) fatal.push('startup/auth blur blocker remained');
            if (!clerkResponses.some((response) => response.url.includes('/v1/environment') && response.status < 400)) fatal.push('Clerk environment request failed');
            if (!clerkResponses.some((response) => response.url.includes('/v1/client') && response.status < 400)) fatal.push('Clerk client request failed');
            if (result.root.status !== 200 || !result.root.title.includes('Jack')) fatal.push('Jack root shell failed');
            if (result.health.status !== 200 || !String(result.health.body).includes('"status":"ok"')) fatal.push('health endpoint failed');
            if (result.edge.recovery !== 'clerk-csp-stable-20260828') fatal.push(`stable edge Worker not observed: ${result.edge.recovery}`);
            for (const required of ['https://clerk.torchlabs.ca', 'https://static.cloudflareinsights.com', 'https://cloudflareinsights.com']) if (!String(result.edge.csp).includes(required)) fatal.push(`CSP missing ${required}`);
            if (pageErrors.length) fatal.push(`${pageErrors.length} page error(s)`);
            if (consoleErrors.length) fatal.push(`${consoleErrors.length} console error(s)`);
            if (failedRequests.length) fatal.push(`${failedRequests.length} failed request(s)`);
            await browser.close();
            if (fatal.length) { console.error(`STABLE_ACCEPTANCE_FAILED: ${fatal.join('; ')}`); process.exit(1); }
            console.log('JACK_PRODUCTION_STABLE_ACCEPTANCE_PASSED');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node acceptance.cjs

      - name: Upload stable acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jack-production-stable-acceptance
          path: |
            /tmp/jack-stable-acceptance/stable-result.json
            /tmp/jack-stable-acceptance/stable-sign-in.png
            /tmp/jack-stable-acceptance/stable-root.png
          if-no-files-found: warn
          retention-days: 7
