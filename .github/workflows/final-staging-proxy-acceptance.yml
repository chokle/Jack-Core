name: Final Staging Proxy Acceptance

on:
  push:
    branches: [ops/staging-proxy-final-20260828]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PUBLIC_HOST: staging-jack.torchlabs.ca
  ORIGIN_HOST: staging.jack.torchlabs.ca
  ORIGIN_TARGET: h3r6mycb.up.railway.app
  SCRIPT_NAME: jack-staging-proxy-final-20260828

jobs:
  deploy-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify direct staging origin, create alias, and bind Worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const publicHost = process.env.PUBLIC_HOST;
          const originHost = process.env.ORIGIN_HOST;
          const originTarget = process.env.ORIGIN_TARGET;
          const scriptName = process.env.SCRIPT_NAME;
          if (!token) throw new Error('CLOUDFLARE_API_TOKEN unavailable');

          async function cf(path, options = {}) {
            const headers = { Authorization: `Bearer ${token}`, ...(options.headers ?? {}) };
            if (!(options.body instanceof FormData)) headers['Content-Type'] = 'application/json';
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { ...options, headers });
            const text = await response.text();
            let payload;
            try { payload = JSON.parse(text); } catch { payload = { success: response.ok, result: text }; }
            if (!response.ok || payload.success === false) {
              throw new Error(`${options.method ?? 'GET'} ${path}: ${response.status} ${JSON.stringify(payload.errors ?? payload)}`);
            }
            return payload.result;
          }

          const zones = await cf('/zones?name=torchlabs.ca&status=active&per_page=50');
          if (!Array.isArray(zones) || zones.length !== 1) throw new Error('Active torchlabs.ca zone was not uniquely resolved');
          const zone = zones[0];

          const originRecords = await cf(`/zones/${zone.id}/dns_records?type=CNAME&name=${originHost}&per_page=100`);
          if (!Array.isArray(originRecords) || originRecords.length !== 1) throw new Error(`Expected one ${originHost} CNAME`);
          const originRecord = originRecords[0];
          if (String(originRecord.content).toLowerCase() !== originTarget || originRecord.proxied !== false) {
            throw new Error(`Original staging route is not safely direct to Railway: ${JSON.stringify({ content: originRecord.content, proxied: originRecord.proxied })}`);
          }

          const workerSource = `
          const ORIGIN = 'https://${originHost}';
          const REQUIRED = {
            'script-src': ['https://clerk.staging.jack.torchlabs.ca', 'https://static.cloudflareinsights.com'],
            'connect-src': ['https://clerk.staging.jack.torchlabs.ca', 'https://cloudflareinsights.com', 'https://static.cloudflareinsights.com'],
            'frame-src': ['https://clerk.staging.jack.torchlabs.ca']
          };
          function patchPolicy(value) {
            if (!value) return value;
            const directives = value.split(';').map((item) => item.trim()).filter(Boolean);
            const map = new Map(directives.map((directive) => [directive.split(/\\s+/, 1)[0], directive]));
            for (const [name, sources] of Object.entries(REQUIRED)) {
              const current = map.get(name) || name;
              const tokens = new Set(current.split(/\\s+/));
              map.set(name, current + sources.filter((source) => !tokens.has(source)).map((source) => ' ' + source).join(''));
            }
            const seen = new Set();
            const output = directives.map((directive) => {
              const name = directive.split(/\\s+/, 1)[0];
              seen.add(name);
              return map.get(name) || directive;
            });
            for (const name of Object.keys(REQUIRED)) if (!seen.has(name)) output.push(map.get(name));
            return output.join('; ');
          }
          export default {
            async fetch(request) {
              const incoming = new URL(request.url);
              const upstreamUrl = new URL(incoming.pathname + incoming.search, ORIGIN);
              const upstream = await fetch(new Request(upstreamUrl, request));
              const response = new Response(upstream.body, upstream);
              const policy = response.headers.get('Content-Security-Policy');
              if (policy) response.headers.set('Content-Security-Policy', patchPolicy(policy));
              response.headers.set('X-Jack-Staging-Proxy', 'final-20260828');
              const location = response.headers.get('Location');
              if (location) response.headers.set('Location', location.replace('${originHost}', '${publicHost}'));
              const type = response.headers.get('Content-Type') || '';
              if (!type.toLowerCase().includes('text/html')) return response;
              return new HTMLRewriter()
                .on('meta[http-equiv="Content-Security-Policy"]', {
                  element(element) {
                    const content = element.getAttribute('content');
                    if (content) element.setAttribute('content', patchPolicy(content));
                  }
                })
                .transform(response);
            }
          };
          `;

          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify({ main_module: 'worker.mjs', compatibility_date: '2026-08-28', bindings: [] })], { type: 'application/json' }), 'metadata.json');
          form.append('worker.mjs', new Blob([workerSource], { type: 'application/javascript+module' }), 'worker.mjs');
          await cf(`/accounts/${zone.account.id}/workers/scripts/${scriptName}`, { method: 'PUT', body: form });

          const aliasRecords = await cf(`/zones/${zone.id}/dns_records?name=${publicHost}&per_page=100`);
          if (aliasRecords.some((record) => record.type !== 'CNAME')) throw new Error(`${publicHost} exists with a non-CNAME record`);
          const aliasBody = {
            type: 'CNAME',
            name: publicHost,
            content: originHost,
            proxied: true,
            ttl: 1,
            comment: 'TLS-safe Jack staging alias; original two-level staging host remains direct to Railway',
          };
          let alias;
          if (aliasRecords.length === 1) {
            alias = await cf(`/zones/${zone.id}/dns_records/${aliasRecords[0].id}`, { method: 'PATCH', body: JSON.stringify(aliasBody) });
          } else if (aliasRecords.length === 0) {
            alias = await cf(`/zones/${zone.id}/dns_records`, { method: 'POST', body: JSON.stringify(aliasBody) });
          } else {
            throw new Error(`Expected zero or one ${publicHost} record; found ${aliasRecords.length}`);
          }

          const pattern = `${publicHost}/*`;
          const routes = await cf(`/zones/${zone.id}/workers/routes`);
          const existingRoute = routes.find((route) => route.pattern === pattern);
          if (existingRoute) {
            await cf(`/zones/${zone.id}/workers/routes/${existingRoute.id}`, { method: 'PUT', body: JSON.stringify({ pattern, script: scriptName }) });
          } else {
            await cf(`/zones/${zone.id}/workers/routes`, { method: 'POST', body: JSON.stringify({ pattern, script: scriptName }) });
          }

          const bound = (await cf(`/zones/${zone.id}/workers/routes`)).find((route) => route.pattern === pattern);
          if (!bound || bound.script !== scriptName) throw new Error(`Worker route did not bind: ${JSON.stringify(bound)}`);
          console.log(JSON.stringify({ originalStaging: { content: originRecord.content, proxied: originRecord.proxied }, alias: { id: alias.id, name: alias.name, content: alias.content, proxied: alias.proxied }, route: bound }, null, 2));
          NODE

      - name: Wait for alias TLS, Jack root, health, Worker marker, and patched HTML CSP
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          for attempt in $(seq 1 45); do
            root_code="$(curl -sS -L -D /tmp/headers.txt -o /tmp/root.html -w '%{http_code}' -H 'Cache-Control: no-cache' "https://$PUBLIC_HOST/?edge_acceptance=$(date +%s%N)" || true)"
            health_code="$(curl -sS -L -o /tmp/health.json -w '%{http_code}' -H 'Cache-Control: no-cache' "https://$PUBLIC_HOST/api/healthz?edge_acceptance=$(date +%s%N)" || true)"
            marker="$(awk 'BEGIN{IGNORECASE=1} /^x-jack-staging-proxy:/{gsub(/\r/,""); print $2}' /tmp/headers.txt | tail -1)"
            if [ "$root_code" = 200 ] \
              && [ "$health_code" = 200 ] \
              && [ "$marker" = final-20260828 ] \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json \
              && grep -Eqi 'Jack — AI Trade Intelligence Engine|application-name[^>]+content="Jack"' /tmp/root.html \
              && grep -Eqi 'http-equiv="Content-Security-Policy"[^>]+https://clerk\.staging\.jack\.torchlabs\.ca' /tmp/root.html \
              && grep -Eqi 'http-equiv="Content-Security-Policy"[^>]+https://static\.cloudflareinsights\.com' /tmp/root.html \
              && grep -Eqi 'http-equiv="Content-Security-Policy"[^>]+https://cloudflareinsights\.com' /tmp/root.html; then
              accepted=true
              echo "Staging alias edge accepted on attempt $attempt"
              break
            fi
            echo "attempt=$attempt root=$root_code health=$health_code marker=${marker:-none}"
            sleep 4
          done
          test "$accepted" = true

      - name: Install mobile browser runner
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          mkdir -p /tmp/jack-staging-final
          cd /tmp/jack-staging-final
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0

      - name: Run strict mobile browser acceptance
        shell: bash
        run: |
          cd /tmp/jack-staging-final
          cat > acceptance.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('node:fs');
          (async () => {
            const origin = 'https://staging-jack.torchlabs.ca';
            const browser = await chromium.launch({ headless: true, executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            const context = await browser.newContext({ viewport: { width: 430, height: 932 }, userAgent: 'Jack-Staging-Final-Acceptance/2026-08-28' });
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];
            const clerkResponses = [];
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            page.on('requestfailed', (request) => failedRequests.push({ url: request.url(), error: request.failure()?.errorText ?? 'unknown' }));
            page.on('response', (response) => { if (/clerk/i.test(response.url())) clerkResponses.push({ url: response.url(), status: response.status() }); });

            const signInResponse = await page.goto(`${origin}/sign-in?acceptance=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(10000);
            const body = (await page.locator('body').innerText()).slice(0, 4000);
            const result = {
              checkedAt: new Date().toISOString(),
              signIn: {
                status: signInResponse?.status() ?? null,
                url: page.url(),
                title: await page.title(),
                body,
                emailInputs: await page.locator('input[type="email"], input[name="identifier"]').count(),
                actionButtons: await page.getByRole('button', { name: /continue|sign in/i }).count(),
                startingJack: await page.getByText('Starting Jack…', { exact: true }).count(),
                authUnavailable: await page.getByText('Sign-in is temporarily unavailable', { exact: true }).count(),
                visibleBlurOverlays: await page.locator('[class*="backdrop-blur"]:visible').count(),
              },
              root: {},
              health: {},
              edge: {},
              pageErrors,
              consoleErrors,
              failedRequests,
              clerkResponses,
            };
            await page.screenshot({ path: 'staging-sign-in.png', fullPage: true });

            const rootResponse = await page.goto(`${origin}/?acceptance=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(4000);
            result.root = { status: rootResponse?.status() ?? null, title: await page.title(), url: page.url() };
            await page.screenshot({ path: 'staging-root.png', fullPage: true });

            const healthResponse = await context.request.get(`${origin}/api/healthz?acceptance=${Date.now()}`, { timeout: 30000 });
            result.health = { status: healthResponse.status(), body: (await healthResponse.text()).slice(0, 1000) };
            const edgeResponse = await context.request.get(`${origin}/?header=${Date.now()}`, { timeout: 30000 });
            result.edge = { status: edgeResponse.status(), marker: edgeResponse.headers()['x-jack-staging-proxy'] ?? null };
            fs.writeFileSync('staging-result.json', JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));

            const fatal = [];
            if (result.signIn.status !== 200 || !result.signIn.title.includes('Jack')) fatal.push('Jack sign-in shell failed');
            if (result.signIn.emailInputs < 1 || result.signIn.actionButtons < 1) fatal.push('Clerk first-step form did not render');
            if (result.signIn.startingJack > 0 || result.signIn.authUnavailable > 0 || result.signIn.visibleBlurOverlays > 0) fatal.push('startup/auth blur blocker remained');
            if (!clerkResponses.some((response) => response.url.includes('/v1/environment') && response.status < 400)) fatal.push('Clerk environment request failed');
            if (!clerkResponses.some((response) => response.url.includes('/v1/client') && response.status < 400)) fatal.push('Clerk client request failed');
            if (result.root.status !== 200 || !result.root.title.includes('Jack')) fatal.push('Jack root shell failed');
            if (result.health.status !== 200 || !String(result.health.body).includes('"status":"ok"')) fatal.push('health endpoint failed');
            if (result.edge.marker !== 'final-20260828') fatal.push(`final staging Worker not observed: ${result.edge.marker}`);
            if (pageErrors.length > 0) fatal.push(`${pageErrors.length} page error(s)`);
            if (consoleErrors.length > 0) fatal.push(`${consoleErrors.length} console error(s)`);
            if (failedRequests.length > 0) fatal.push(`${failedRequests.length} failed request(s)`);
            await browser.close();
            if (fatal.length) {
              console.error(`FINAL_STAGING_ACCEPTANCE_FAILED: ${fatal.join('; ')}`);
              process.exit(1);
            }
            console.log('JACK_STAGING_FINAL_ACCEPTANCE_PASSED');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node acceptance.cjs

      - name: Upload final staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jack-staging-final-acceptance
          path: |
            /tmp/jack-staging-final/staging-result.json
            /tmp/jack-staging-final/staging-sign-in.png
            /tmp/jack-staging-final/staging-root.png
          if-no-files-found: warn
          retention-days: 7
