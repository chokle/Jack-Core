name: Verify Live Jack Auth Rendered

on:
  push:
    branches:
      - hotfix/clerk-fapi-csp-20260828
    paths:
      - ".ops/verify-live-jack-auth-rendered-20260828.txt"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rendered-auth-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jack-rendered-auth"
          cd "$RUNNER_TEMP/jack-rendered-auth"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify rendered production sign-in
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/jack-rendered-auth"
          cat > verify.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 430, height: 932 },
              userAgent: 'Jack-Rendered-Auth-Acceptance/2026-08-28',
            });
            const page = await context.newPage();
            const pageErrors = [];
            const failedRequests = [];
            const clerkResponses = [];

            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('requestfailed', (request) => failedRequests.push({
              url: request.url(),
              error: request.failure()?.errorText || 'unknown',
            }));
            page.on('response', (response) => {
              if (response.url().includes('clerk.torchlabs.ca')) {
                clerkResponses.push({
                  url: response.url(),
                  status: response.status(),
                  contentType: response.headers()['content-type'] || '',
                });
              }
            });

            const response = await page.goto('https://jack.torchlabs.ca/sign-in', {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });

            const emailSelector = 'input[type="email"], input[name="email"], input[name="identifier"]';
            await page.locator(emailSelector).first().waitFor({ state: 'visible', timeout: 20000 });
            await page.waitForTimeout(1500);

            const emailInput = page.locator(emailSelector).first();
            const metaCsp = await page
              .locator('meta[http-equiv="Content-Security-Policy"]')
              .getAttribute('content');
            const body = (await page.locator('body').innerText()).slice(0, 3000);
            const health = await context.request.get('https://jack.torchlabs.ca/api/healthz', {
              timeout: 30000,
            });

            const result = {
              checkedAt: new Date().toISOString(),
              status: response?.status() || null,
              url: page.url(),
              headerCsp: response?.headers()['content-security-policy'] || '',
              metaCsp,
              body,
              emailInputVisible: await emailInput.isVisible(),
              emailInputEnabled: await emailInput.isEnabled(),
              continueButtons: await page.getByRole('button', { name: /continue/i }).count(),
              authUnavailable: await page.getByText('Sign-in is temporarily unavailable', { exact: true }).count(),
              pageErrors,
              failedRequests,
              clerkResponses,
              health: { status: health.status(), body: await health.text() },
            };

            fs.writeFileSync('result.json', JSON.stringify(result, null, 2));
            await page.screenshot({ path: 'sign-in-rendered.png', fullPage: true });
            console.log(JSON.stringify(result, null, 2));

            const fatal = [];
            if (result.status !== 200) fatal.push(`sign-in status ${result.status}`);
            if (!result.headerCsp.includes('https://clerk.torchlabs.ca')) fatal.push('HTTP CSP stale');
            if (!String(result.metaCsp || '').includes('https://clerk.torchlabs.ca')) fatal.push('HTML CSP stale');
            if (!result.emailInputVisible || !result.emailInputEnabled) fatal.push('email input is not usable');
            if (result.continueButtons < 1) fatal.push('Continue button missing');
            if (result.authUnavailable > 0) fatal.push('fallback remains visible');
            if (!result.body.includes('Pilot participant access')) fatal.push('pilot sign-in copy missing');
            if (result.pageErrors.some((value) => /Clerk|clerk/i.test(value))) fatal.push('Clerk page error remains');
            if (result.failedRequests.some((entry) => /clerk\.torchlabs\.ca|@clerk\/ui/i.test(entry.url))) {
              fatal.push('Clerk request failed');
            }
            if (!result.clerkResponses.some((entry) => entry.status >= 200 && entry.status < 400)) {
              fatal.push('no successful Clerk response observed');
            }
            if (result.health.status !== 200 || !result.health.body.includes('"status":"ok"')) {
              fatal.push('production health failed');
            }

            await browser.close();
            if (fatal.length) {
              console.error(`LIVE_JACK_RENDERED_AUTH_FAILED: ${fatal.join('; ')}`);
              process.exit(1);
            }
            console.log('LIVE_JACK_RENDERED_AUTH_PASSED');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node verify.cjs

      - name: Upload rendered acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-jack-rendered-auth-evidence
          path: |
            ${{ runner.temp }}/jack-rendered-auth/result.json
            ${{ runner.temp }}/jack-rendered-auth/sign-in-rendered.png
          if-no-files-found: warn
          retention-days: 7
