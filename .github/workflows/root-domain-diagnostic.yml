name: Root Domain Origin Validation

on:
  push:
    branches:
      - ops/diagnose-root-domain-20260828
    paths:
      - .github/workflows/root-domain-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate the pre-August-25 landing origin
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api_root='https://api.cloudflare.com/client/v4'
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          zone_json="$(curl --silent --show-error --fail-with-body \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            "${api_root}/zones?name=torchlabs.ca&status=active&per_page=50")"
          account_id="$(jq -r '.result[0].account.id // empty' <<<"$zone_json")"
          [[ -n "$account_id" ]] || { echo 'Cloudflare account not resolved'; exit 1; }

          echo '=== Audit resource history: www update ==='
          history_body="$(mktemp)"
          history_status="$(curl --silent --show-error \
            --output "$history_body" --write-out '%{http_code}' \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            "${api_root}/accounts/${account_id}/logs/audit/01a03964-11d2-7601-b739-26d640c2d3e8/history")"
          echo "History HTTP ${history_status}"
          if [[ "$history_status" =~ ^2 ]]; then
            jq -c '[.result[] | {id,action,raw,resource,zone}]' "$history_body"
          else
            cat "$history_body"
          fi

          echo '=== Current DNS for chatgpt.site ==='
          dig +short A chatgpt.site || true
          dig +short AAAA chatgpt.site || true

          echo '=== Direct origin acceptance ==='
          passed=0
          for host in torchlabs.ca www.torchlabs.ca; do
            for ip in 162.159.143.30 172.66.3.26; do
              echo "--- ${host} via ${ip}"
              body="$(mktemp)"
              headers="$(mktemp)"
              code="$(curl --silent --show-error --location --max-time 30 \
                --resolve "${host}:443:${ip}" \
                --dump-header "$headers" \
                --output "$body" \
                --write-out '%{http_code}' \
                "https://${host}/" || true)"
              echo "HTTP ${code:-000}"
              awk 'BEGIN{IGNORECASE=1} /^HTTP\// || /^server:/ || /^location:/ || /^cf-cache-status:/ {gsub(/\r/,""); print}' "$headers" || true
              title="$(grep -Eio '<title>[^<]*</title>' "$body" | head -1 | sed -E 's#</?title>##Ig' || true)"
              echo "title=${title}"
              markers="$(grep -Eio 'FIELD INTELLIGENCE FOR THE SKILLED TRADES|The knowledge[^<]{0,80}|Torch didn.t start in a boardroom|Field intelligence for the skilled trades' "$body" | head -4 | tr '\n' ' ' || true)"
              echo "markers=${markers}"
              if [[ "$code" =~ ^2 ]] && grep -Eqi 'FIELD INTELLIGENCE FOR THE SKILLED TRADES|The knowledge|Torch didn.t start in a boardroom|Field intelligence for the skilled trades' "$body"; then
                passed=$((passed + 1))
              fi
            done
          done
          echo "validated_origin_responses=${passed}"
          if (( passed == 0 )); then
            echo 'No original landing response validated; refusing blind DNS restore.'
            exit 1
          fi
