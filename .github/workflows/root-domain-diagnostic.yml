name: Root Domain Former Origin Validation

on:
  push:
    branches:
      - ops/diagnose-root-domain-20260828
    paths:
      - .github/workflows/root-domain-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-former-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate former Totalum landing deployment and custom-host routing
        shell: bash
        run: |
          set -euo pipefail
          target='dnv-9793f3846a98471cb2b0-fm6h0p.totalum-project.com'

          echo '=== Former target DNS ==='
          echo 'CNAME:'
          dig +short CNAME "$target" || true
          echo 'A:'
          mapfile -t target_ips < <(dig +short A "$target" | grep -E '^[0-9.]+$' | sort -u)
          printf '%s\n' "${target_ips[@]:-}"
          echo 'AAAA:'
          dig +short AAAA "$target" || true

          echo '=== Direct target HTTPS ==='
          direct_body="$(mktemp)"
          direct_headers="$(mktemp)"
          direct_code="$(curl --silent --show-error --location --max-time 30 \
            --dump-header "$direct_headers" \
            --output "$direct_body" \
            --write-out '%{http_code}' \
            "https://${target}/" || true)"
          echo "HTTP ${direct_code:-000}"
          awk 'BEGIN{IGNORECASE=1} /^HTTP\// || /^server:/ || /^location:/ || /^content-type:/ || /^cf-cache-status:/ || /^x-powered-by:/ {gsub(/\r/,""); print}' "$direct_headers" || true
          direct_title="$(grep -Eio '<title>[^<]*</title>' "$direct_body" | head -1 | sed -E 's#</?title>##Ig' || true)"
          echo "title=${direct_title}"
          direct_markers="$(grep -Eio 'FIELD INTELLIGENCE FOR THE SKILLED TRADES|The knowledge[^<]{0,180}|Torch didn.t start in a boardroom|Built for the field|Structured mentorship|Red Seal' "$direct_body" | head -10 | tr '\n' ' ' || true)"
          echo "markers=${direct_markers}"
          echo -n 'body_sha256='; sha256sum "$direct_body" | awk '{print $1}'
          echo -n 'body_bytes='; wc -c < "$direct_body"

          echo '=== Direct target HTTP ==='
          curl --silent --show-error --head --max-time 30 "http://${target}/" || true

          echo '=== Custom-host tests through former target IPs ==='
          accepted=0
          for host in torchlabs.ca www.torchlabs.ca; do
            for ip in "${target_ips[@]:-}"; do
              [[ -n "$ip" ]] || continue
              echo "--- ${host} via ${ip}"
              body="$(mktemp)"
              headers="$(mktemp)"
              code="$(curl --silent --show-error --location --max-time 30 \
                --resolve "${host}:443:${ip}" \
                --dump-header "$headers" \
                --output "$body" \
                --write-out '%{http_code}' \
                "https://${host}/" || true)"
              echo "HTTP ${code:-000}"
              awk 'BEGIN{IGNORECASE=1} /^HTTP\// || /^server:/ || /^location:/ || /^content-type:/ || /^cf-cache-status:/ || /^x-powered-by:/ {gsub(/\r/,""); print}' "$headers" || true
              title="$(grep -Eio '<title>[^<]*</title>' "$body" | head -1 | sed -E 's#</?title>##Ig' || true)"
              echo "title=${title}"
              markers="$(grep -Eio 'FIELD INTELLIGENCE FOR THE SKILLED TRADES|The knowledge[^<]{0,180}|Torch didn.t start in a boardroom|Built for the field|Structured mentorship|Red Seal' "$body" | head -10 | tr '\n' ' ' || true)"
              echo "markers=${markers}"
              echo -n 'body_sha256='; sha256sum "$body" | awk '{print $1}'
              if [[ "$code" =~ ^2 ]] && grep -Eqi 'FIELD INTELLIGENCE FOR THE SKILLED TRADES|The knowledge|Torch didn.t start in a boardroom|Built for the field|Structured mentorship|Red Seal' "$body"; then
                accepted=$((accepted + 1))
              fi
            done
          done
          echo "former_origin_acceptances=${accepted}"

          if [[ ! "$direct_code" =~ ^2 ]] || [[ ! -s "$direct_body" ]]; then
            echo 'Former deployment is not serving a usable HTTPS response.'
            exit 1
          fi
