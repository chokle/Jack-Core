name: Root Domain Pre-Switch State Recovery

on:
  push:
    branches:
      - ops/diagnose-root-domain-20260828
    paths:
      - .github/workflows/root-domain-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-pre-switch-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconstruct DNS and Pages state before August 25 switch
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          zone_json="$(curl -fsS -H "$auth" -H 'Content-Type: application/json' "${api}/zones?name=torchlabs.ca&status=active&per_page=50")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zone_json")"
          account_id="$(jq -r '.result[0].account.id // empty' <<<"$zone_json")"
          [[ -n "$zone_id" && -n "$account_id" ]] || { echo 'Cloudflare context missing'; exit 1; }

          fetch_audit() {
            local since="$1" before="$2" output="$3"
            curl -fsS --get -H "$auth" -H 'Content-Type: application/json' \
              --data-urlencode "since=${since}" \
              --data-urlencode "before=${before}" \
              --data-urlencode "zone_id=${zone_id}" \
              "${api}/accounts/${account_id}/logs/audit" > "$output"
          }

          mkdir -p /tmp/audit
          fetch_audit '2026-06-01T00:00:00Z' '2026-07-01T00:00:00Z' /tmp/audit/june.json
          fetch_audit '2026-07-01T00:00:00Z' '2026-08-01T00:00:00Z' /tmp/audit/july.json
          fetch_audit '2026-08-01T00:00:00Z' '2026-08-26T00:00:00Z' /tmp/audit/august.json

          jq -s '{result: ([.[].result[]])}' /tmp/audit/june.json /tmp/audit/july.json /tmp/audit/august.json > /tmp/audit/all.json

          echo '=== Every root/www DNS mutation June 1 through August 25 ==='
          jq -c '[.result[]
            | select((.resource.product // "") == "dns_records")
            | select(
                ((.resource.request.name // "") == "torchlabs.ca") or
                ((.resource.request.name // "") == "www.torchlabs.ca") or
                ((.resource.response.name // "") == "torchlabs.ca") or
                ((.resource.response.name // "") == "www.torchlabs.ca") or
                ((.resource.id // "") == "d50fc7415cb8741d42dc8012fce3708e") or
                ((.resource.id // "") == "a3bddf86ebd459ef3e6c292da827c13e") or
                ((.resource.id // "") == "4f8af1675e9d7231222b3d21fd069af7") or
                ((.resource.id // "") == "9d1491d202988497ca6e161887f99bf0")
              )
            | {
                id,
                time:.action.time,
                action:.action.description,
                type:.action.type,
                result:.action.result,
                actor:{context:.actor.context,email:.actor.email,ip:.actor.ip_address,token_name:.actor.token.name},
                resource_id:.resource.id,
                request:.resource.request,
                response:.resource.response,
                raw:.raw
              }
          ] | sort_by(.time)' /tmp/audit/all.json

          echo '=== Any Pages/custom-domain/Sites-related mutations ==='
          jq -c '[.result[]
            | select((tostring | test("pages|custom.domain|hostname|chatgpt|sites|162\\.159\\.143\\.30|172\\.66\\.3\\.26"; "i")))
            | {id,time:.action.time,action:.action.description,type:.action.type,actor:{context:.actor.context,email:.actor.email,token_name:.actor.token.name},raw:.raw,resource:.resource}
          ] | sort_by(.time)' /tmp/audit/all.json

          echo '=== Current Pages domains ==='
          curl -fsS -H "$auth" -H 'Content-Type: application/json' \
            "${api}/accounts/${account_id}/pages/projects/torch-mvp/domains" \
            | jq -c '[.result[] | {id,name,status,created_on,validation_data,verification_data}]'
