name: Root Domain Audit Recovery

on:
  push:
    branches:
      - ops/diagnose-root-domain-20260828
    paths:
      - .github/workflows/root-domain-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover prior root-domain DNS target from Cloudflare audit logs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Missing CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          api_root='https://api.cloudflare.com/client/v4'
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          zone_json="$(curl --silent --show-error --fail-with-body \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            "${api_root}/zones?name=torchlabs.ca&status=active&per_page=50")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zone_json")"
          account_id="$(jq -r '.result[0].account.id // empty' <<<"$zone_json")"
          if [[ -z "$zone_id" || -z "$account_id" ]]; then
            echo 'Could not resolve active torchlabs.ca zone/account'
            exit 1
          fi

          since='2026-08-25T14:30:00Z'
          before='2026-08-25T17:20:00Z'

          echo '=== Legacy account audit endpoint ==='
          legacy_body="$(mktemp)"
          legacy_status="$(curl --silent --show-error --get \
            --output "$legacy_body" --write-out '%{http_code}' \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --data-urlencode "since=${since}" \
            --data-urlencode "before=${before}" \
            --data-urlencode 'per_page=1000' \
            --data-urlencode 'direction=asc' \
            "${api_root}/accounts/${account_id}/audit_logs")"
          echo "Legacy audit HTTP ${legacy_status}"
          if [[ "$legacy_status" =~ ^2 ]]; then
            jq -c '[.result[] | select((tostring | test("torchlabs\\.ca|dns|record|9d1491d202988497ca6e161887f99bf0|4f8af1675e9d7231222b3d21fd069af7"; "i"))) | {id,when,action,actor:{id,email,type,interface},resource,oldValue,newValue,metadata}]' "$legacy_body"
          else
            cat "$legacy_body"
          fi

          echo '=== Version 2 account audit endpoint ==='
          v2_body="$(mktemp)"
          v2_status="$(curl --silent --show-error --get \
            --output "$v2_body" --write-out '%{http_code}' \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --data-urlencode "since=${since}" \
            --data-urlencode "before=${before}" \
            --data-urlencode "zone_id=${zone_id}" \
            "${api_root}/accounts/${account_id}/logs/audit")"
          echo "V2 audit HTTP ${v2_status}"
          if [[ "$v2_status" =~ ^2 ]]; then
            jq -c '[.result[] | select((tostring | test("torchlabs\\.ca|dns|record|9d1491d202988497ca6e161887f99bf0|4f8af1675e9d7231222b3d21fd069af7"; "i"))) | {id,action,actor:{id,email,type,context,token_name},raw:{method,status_code,uri},resource,zone}]' "$v2_body"
          else
            cat "$v2_body"
          fi
