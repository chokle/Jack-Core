name: Stable Staging Edge Acceptance

on:
  push:
    branches: [ops/stable-staging-edge-20260828]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  JACK_HOST: staging.jack.torchlabs.ca
  RAILWAY_TARGET: h3r6mycb.up.railway.app
  EDGE_SCRIPT: jack-staging-csp-stable-20260828

jobs:
  deploy-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Deploy and bind staging CSP Worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN,host=process.env.JACK_HOST,target=process.env.RAILWAY_TARGET,script=process.env.EDGE_SCRIPT;
          if(!token) throw new Error('CLOUDFLARE_API_TOKEN unavailable');
          async function cf(path,options={}){const headers={Authorization:`Bearer ${token}`,...(options.headers??{})};if(!(options.body instanceof FormData))headers['Content-Type']='application/json';const r=await fetch(`https://api.cloudflare.com/client/v4${path}`,{...options,headers});const t=await r.text();let p;try{p=JSON.parse(t)}catch{p={success:r.ok,result:t}}if(!r.ok||p.success===false)throw new Error(`${options.method??'GET'} ${path}: ${r.status} ${JSON.stringify(p.errors??p)}`);return p.result}
          const zones=await cf('/zones?name=torchlabs.ca&status=active&per_page=50');if(!Array.isArray(zones)||zones.length!==1)throw new Error('Zone not uniquely resolved');const zone=zones[0];
          const records=await cf(`/zones/${zone.id}/dns_records?type=CNAME&name=${host}&per_page=100`);if(!Array.isArray(records)||records.length!==1)throw new Error(`Expected one ${host} CNAME`);const record=records[0];if(String(record.content).toLowerCase()!==target)throw new Error(`Unexpected staging origin ${record.content}`);
          const source=`
          const REQUIRED={
            'script-src':['https://clerk.staging.jack.torchlabs.ca','https://static.cloudflareinsights.com'],
            'connect-src':['https://clerk.staging.jack.torchlabs.ca','https://cloudflareinsights.com','https://static.cloudflareinsights.com'],
            'frame-src':['https://clerk.staging.jack.torchlabs.ca']
          };
          function patch(v){if(!v)return v;const ds=v.split(';').map(x=>x.trim()).filter(Boolean),m=new Map(ds.map(d=>[d.split(/\\s+/,1)[0],d]));for(const [n,ss] of Object.entries(REQUIRED)){const c=m.get(n)||n,t=new Set(c.split(/\\s+/));m.set(n,c+ss.filter(s=>!t.has(s)).map(s=>' '+s).join(''))}const seen=new Set(),out=ds.map(d=>{const n=d.split(/\\s+/,1)[0];seen.add(n);return m.get(n)||d});for(const n of Object.keys(REQUIRED))if(!seen.has(n))out.push(m.get(n));return out.join('; ')}
          export default{async fetch(req){const up=await fetch(req),res=new Response(up.body,up),p=res.headers.get('Content-Security-Policy');if(p)res.headers.set('Content-Security-Policy',patch(p));res.headers.set('X-Jack-Edge-Recovery','staging-csp-stable-20260828');const type=res.headers.get('Content-Type')||'';if(!type.toLowerCase().includes('text/html'))return res;return new HTMLRewriter().on('meta[http-equiv="Content-Security-Policy"]',{element(e){const c=e.getAttribute('content');if(c)e.setAttribute('content',patch(c))}}).transform(res)}};`;
          const form=new FormData();form.append('metadata',new Blob([JSON.stringify({main_module:'worker.mjs',compatibility_date:'2026-08-28',bindings:[]})],{type:'application/json'}),'metadata.json');form.append('worker.mjs',new Blob([source],{type:'application/javascript+module'}),'worker.mjs');await cf(`/accounts/${zone.account.id}/workers/scripts/${script}`,{method:'PUT',body:form});
          const pattern=`${host}/*`,routes=await cf(`/zones/${zone.id}/workers/routes`),route=(routes??[]).find(r=>r.pattern===pattern);if(route)await cf(`/zones/${zone.id}/workers/routes/${route.id}`,{method:'PUT',body:JSON.stringify({pattern,script})});else await cf(`/zones/${zone.id}/workers/routes`,{method:'POST',body:JSON.stringify({pattern,script})});
          if(record.proxied!==true)await cf(`/zones/${zone.id}/dns_records/${record.id}`,{method:'PATCH',body:JSON.stringify({type:'CNAME',name:host,content:target,proxied:true,ttl:1,comment:'Stable Jack staging CSP recovery, 2026-08-28'})});
          const bound=(await cf(`/zones/${zone.id}/workers/routes`)).find(r=>r.pattern===pattern);if(!bound||bound.script!==script)throw new Error(`Route binding failed ${JSON.stringify(bound)}`);console.log(JSON.stringify({dns:{content:target,proxied:true},route:bound},null,2));
          NODE
      - name: Wait for stable staging edge and health
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 36); do
            curl -sS -L -D /tmp/h -o /tmp/root -H 'Cache-Control: no-cache' "https://$JACK_HOST/?accept=$(date +%s%N)" || true
            code="$(curl -sS -L -o /tmp/health -w '%{http_code}' -H 'Cache-Control: no-cache' "https://$JACK_HOST/api/healthz?accept=$(date +%s%N)" || true)"
            marker="$(awk 'BEGIN{IGNORECASE=1}/^x-jack-edge-recovery:/{gsub(/\r/,"");print $2}' /tmp/h|tail -1)"
            if [ "$marker" = staging-csp-stable-20260828 ] && [ "$code" = 200 ] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health && grep -Eqi 'Jack — AI Trade Intelligence Engine|application-name[^>]+content="Jack"' /tmp/root; then ok=true; echo "Staging edge accepted on attempt $attempt"; break; fi
            echo "attempt=$attempt marker=${marker:-none} health=$code"; sleep 4
          done
          test "$ok" = true
      - name: Install mobile browser runner
        shell: bash
        run: |
          command -v google-chrome
          mkdir -p /tmp/staging-accept && cd /tmp/staging-accept
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
      - name: Run strict staging mobile acceptance
        shell: bash
        run: |
          cd /tmp/staging-accept
          cat > accept.cjs <<'NODE'
          const {chromium}=require('playwright-core');const fs=require('node:fs');
          (async()=>{const origin='https://staging.jack.torchlabs.ca',browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']}),context=await browser.newContext({viewport:{width:430,height:932},userAgent:'Jack-Staging-Stable-Acceptance/2026-08-28'}),page=await context.newPage(),pageErrors=[],consoleErrors=[],failedRequests=[],clerkResponses=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});page.on('requestfailed',r=>failedRequests.push({url:r.url(),error:r.failure()?.errorText??'unknown'}));page.on('response',r=>{if(/clerk/i.test(r.url()))clerkResponses.push({url:r.url(),status:r.status()})});
          const sign=await page.goto(`${origin}/sign-in?stable=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(10000);const body=(await page.locator('body').innerText()).slice(0,4000),result={checkedAt:new Date().toISOString(),signIn:{status:sign?.status()??null,url:page.url(),title:await page.title(),body,emailInputs:await page.locator('input[type="email"], input[name="identifier"]').count(),actionButtons:await page.getByRole('button',{name:/continue|sign in/i}).count(),startingJack:await page.getByText('Starting Jack…',{exact:true}).count(),authUnavailable:await page.getByText('Sign-in is temporarily unavailable',{exact:true}).count(),visibleBlurOverlays:await page.locator('[class*="backdrop-blur"]:visible').count()},root:{},health:{},edge:{},pageErrors,consoleErrors,failedRequests,clerkResponses};await page.screenshot({path:'staging-sign-in.png',fullPage:true});
          const root=await page.goto(`${origin}/?stable=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(4000);result.root={status:root?.status()??null,title:await page.title(),url:page.url()};await page.screenshot({path:'staging-root.png',fullPage:true});const health=await context.request.get(`${origin}/api/healthz?stable=${Date.now()}`);result.health={status:health.status(),body:(await health.text()).slice(0,1000)};const edge=await context.request.get(`${origin}/?header=${Date.now()}`);result.edge={status:edge.status(),recovery:edge.headers()['x-jack-edge-recovery']??null,csp:edge.headers()['content-security-policy']??null};fs.writeFileSync('staging-result.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));
          const fatal=[];if(result.signIn.status!==200||!result.signIn.title.includes('Jack'))fatal.push('sign-in shell failed');if(result.signIn.emailInputs<1||result.signIn.actionButtons<1)fatal.push('Clerk form did not render');if(result.signIn.startingJack||result.signIn.authUnavailable||result.signIn.visibleBlurOverlays)fatal.push('startup/auth blur blocker remained');if(!clerkResponses.some(r=>r.url.includes('/v1/environment')&&r.status<400))fatal.push('Clerk environment failed');if(!clerkResponses.some(r=>r.url.includes('/v1/client')&&r.status<400))fatal.push('Clerk client failed');if(result.root.status!==200||!result.root.title.includes('Jack'))fatal.push('root failed');if(result.health.status!==200||!result.health.body.includes('"status":"ok"'))fatal.push('health failed');if(result.edge.recovery!=='staging-csp-stable-20260828')fatal.push('stable Worker absent');for(const s of ['https://clerk.staging.jack.torchlabs.ca','https://static.cloudflareinsights.com','https://cloudflareinsights.com'])if(!String(result.edge.csp).includes(s))fatal.push(`CSP missing ${s}`);if(pageErrors.length)fatal.push(`${pageErrors.length} page errors`);if(consoleErrors.length)fatal.push(`${consoleErrors.length} console errors`);if(failedRequests.length)fatal.push(`${failedRequests.length} failed requests`);await browser.close();if(fatal.length){console.error(`STAGING_ACCEPTANCE_FAILED: ${fatal.join('; ')}`);process.exit(1)}console.log('JACK_STAGING_STABLE_ACCEPTANCE_PASSED')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node accept.cjs
      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jack-staging-stable-acceptance
          path: |
            /tmp/staging-accept/staging-result.json
            /tmp/staging-accept/staging-sign-in.png
            /tmp/staging-accept/staging-root.png
          if-no-files-found: warn
          retention-days: 7
