name: Issue 105 current-main verification

on:
  push:
    branches:
      - fix/105-current-main-drilldown

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused Living Memory regressions
        run: >-
          pnpm --filter @workspace/jack-core exec vitest run
          src/components/MemoryGraphView.navigation-state.test.ts
          src/components/SpatialBrainCanvas.navigation-state.test.ts
          src/components/SpatialBrainCanvas.pointer.test.ts
          src/lib/graph-spatial.test.ts
      - name: Jack full tests
        run: pnpm --filter @workspace/jack-core test
      - name: Workspace typecheck
        run: pnpm typecheck
      - name: Workspace build
        run: pnpm build
      - name: Format check
        run: >-
          pnpm exec prettier --check
          artifacts/jack-core/src/components/MemoryGraphView.navigation-state.test.ts
          artifacts/jack-core/src/components/MemoryGraphView.tsx
          artifacts/jack-core/src/components/SpatialBrainCanvas.navigation-state.test.ts
          artifacts/jack-core/src/components/SpatialBrainCanvas.pointer.test.ts
          artifacts/jack-core/src/components/SpatialBrainCanvas.tsx
          artifacts/jack-core/src/lib/graph-spatial.test.ts
          artifacts/jack-core/src/lib/graph-spatial.ts
      - name: Diff integrity
        run: git diff --check origin/main...HEAD
