name: Pilot001 auth bypass apply

on:
  push:
    branches: [pilot001-auth-bypass]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apply-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Apply rollback-safe pilot auth bypass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def patch(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          # Frontend: bypass Clerk provider entirely for the pilot runtime.
          patch(
              "artifacts/jack-core/src/App.tsx",
              'const configuredClerkPubKey = import.meta.env.VITE_CLERK_PUBLISHABLE_KEY;\n',
              'const configuredClerkPubKey = import.meta.env.VITE_CLERK_PUBLISHABLE_KEY;\nconst pilotAuthBypass = import.meta.env.VITE_PILOT_AUTH_BYPASS === "true";\n',
          )
          patch(
              "artifacts/jack-core/src/App.tsx",
              'if (!clerkPubKey) {\n  throw new Error("Missing VITE_CLERK_PUBLISHABLE_KEY");\n}\n',
              'if (!pilotAuthBypass && !clerkPubKey) {\n  throw new Error("Missing VITE_CLERK_PUBLISHABLE_KEY");\n}\n',
          )
          patch(
              "artifacts/jack-core/src/App.tsx",
              'function App() {\n  return <ManagedAppEntry />;\n}\n',
              '''function PilotBypassApp() {\n  useEffect(() => {\n    setAuthTokenGetter(null);\n    window.__JACK_MARK_READY__?.();\n    return () => setAuthTokenGetter(null);\n  }, []);\n  return (\n    <QueryClientProvider client={queryClient}>\n      <AppSurface />\n    </QueryClientProvider>\n  );\n}\n\nfunction App() {\n  return pilotAuthBypass ? <PilotBypassApp /> : <ManagedAppEntry />;\n}\n''',
          )

          # API composition: do not initialize Clerk proxy/middleware in bypass mode.
          patch(
              "artifacts/api-server/src/app.ts",
              'const app: Express = express();\n',
              'const app: Express = express();\nconst pilotAuthBypass = process.env["PILOT_AUTH_BYPASS"] === "true";\n',
          )
          patch(
              "artifacts/api-server/src/app.ts",
              'app.use(CLERK_PROXY_PATH, clerkProxyMiddleware());\n',
              'if (!pilotAuthBypass) app.use(CLERK_PROXY_PATH, clerkProxyMiddleware());\n',
          )
          patch(
              "artifacts/api-server/src/app.ts",
              'app.use(clerkMiddleware({ publishableKey: process.env.CLERK_PUBLISHABLE_KEY }));\n',
              'if (!pilotAuthBypass) {\n  app.use(clerkMiddleware({ publishableKey: process.env.CLERK_PUBLISHABLE_KEY }));\n}\n',
          )

          # Server auth gate: stable synthetic pilot identity; one env flip restores Clerk.
          patch(
              "artifacts/api-server/src/middlewares/requireAuth.ts",
              '  const isClerkProxyRequest = req.path.startsWith("/__clerk");\n',
              '''  if (process.env["PILOT_AUTH_BYPASS"] === "true") {\n    req.userId = process.env["PILOT_AUTH_USER_ID"]?.trim() || "pilot001-bypass";\n    next();\n    return;\n  }\n\n  const isClerkProxyRequest = req.path.startsWith("/__clerk");\n''',
          )

          # Identity resolution used by /me and admin gates.
          patch(
              "artifacts/api-server/src/lib/admin-auth.ts",
              'export async function resolveIdentity(req: Request): Promise<CallerIdentity | null> {\n  let userId: string | null | undefined;\n',
              '''export async function resolveIdentity(req: Request): Promise<CallerIdentity | null> {\n  if (process.env["PILOT_AUTH_BYPASS"] === "true") {\n    const userId = req.userId ?? process.env["PILOT_AUTH_USER_ID"]?.trim() ?? "pilot001-bypass";\n    const email = process.env["PILOT_AUTH_EMAIL"]?.trim() || null;\n    return {\n      userId,\n      email,\n      name: process.env["PILOT_AUTH_NAME"]?.trim() || "Pilot001",\n      isAdmin: process.env["PILOT_AUTH_ADMIN"] === "true",\n      isPresentation: false,\n      classification: "resolved",\n    };\n  }\n  let userId: string | null | undefined;\n''',
          )
          patch(
              "artifacts/api-server/src/lib/admin-auth.ts",
              '''    let userId: string | null | undefined;\n    try {\n      userId = getAuth(req)?.userId;\n    } catch {\n      userId = null;\n    }\n''',
              '''    let userId: string | null | undefined;\n    if (process.env["PILOT_AUTH_BYPASS"] === "true") {\n      userId = req.userId ?? process.env["PILOT_AUTH_USER_ID"]?.trim() ?? "pilot001-bypass";\n    } else {\n      try {\n        userId = getAuth(req)?.userId;\n      } catch {\n        userId = null;\n      }\n    }\n''',
          )

          # Clerk-backed onboarding metadata becomes a safe no-op while bypassed.
          patch(
              "artifacts/api-server/src/routes/me.ts",
              'const router = Router();\n',
              'const router = Router();\nconst pilotAuthBypass = process.env["PILOT_AUTH_BYPASS"] === "true";\n',
          )
          patch(
              "artifacts/api-server/src/routes/me.ts",
              'router.get("/me/preferences/memory-graph-onboarding", async (req, res) => {\n  const userId = authenticatedUserId(req);\n',
              'router.get("/me/preferences/memory-graph-onboarding", async (req, res) => {\n  if (pilotAuthBypass) return res.json(GetMemoryGraphOnboardingPreferenceResponse.parse({ preference: null }));\n  const userId = authenticatedUserId(req);\n',
          )
          patch(
              "artifacts/api-server/src/routes/me.ts",
              '  const preference = readPreference(req.body);\n  if (!preference) return res.status(400).json({ error: "Invalid onboarding preference." });\n\n  try {\n',
              '  const preference = readPreference(req.body);\n  if (!preference) return res.status(400).json({ error: "Invalid onboarding preference." });\n  if (pilotAuthBypass) return res.json(UpdateMemoryGraphOnboardingPreferenceResponse.parse({ preference }));\n\n  try {\n',
          )

          # Container image: remove Clerk build hard dependency and compile bypass flag in.
          patch(
              "Dockerfile.cloudflare",
              'ARG VITE_CLERK_PUBLISHABLE_KEY\nARG VITE_DISABLE_CLERK_PROXY=true\nARG VITE_ENABLE_CLERK_PROXY=false\n\nRUN test -n "$VITE_CLERK_PUBLISHABLE_KEY"\n',
              'ARG VITE_CLERK_PUBLISHABLE_KEY\nARG VITE_PILOT_AUTH_BYPASS=true\nARG VITE_DISABLE_CLERK_PROXY=true\nARG VITE_ENABLE_CLERK_PROXY=false\n',
          )
          patch(
              "Dockerfile.cloudflare",
              'ENV VITE_CLERK_PUBLISHABLE_KEY=$VITE_CLERK_PUBLISHABLE_KEY\nENV VITE_DISABLE_CLERK_PROXY=$VITE_DISABLE_CLERK_PROXY\n',
              'ENV VITE_CLERK_PUBLISHABLE_KEY=$VITE_CLERK_PUBLISHABLE_KEY\nENV VITE_PILOT_AUTH_BYPASS=$VITE_PILOT_AUTH_BYPASS\nENV VITE_DISABLE_CLERK_PROXY=$VITE_DISABLE_CLERK_PROXY\n',
          )

          # Cloudflare runtime defaults: bypass on, Clerk secret no longer required.
          p = Path("cloudflare/wrangler.base.json")
          cfg = json.loads(p.read_text())
          cfg["vars"]["PILOT_AUTH_BYPASS"] = "true"
          cfg["vars"]["PILOT_AUTH_USER_ID"] = "pilot001-bypass"
          cfg["secrets"]["required"] = [x for x in cfg["secrets"]["required"] if x != "CLERK_SECRET_KEY"]
          p.write_text(json.dumps(cfg, indent=2) + "\n")

          # Generated config no longer requires Clerk publishable key in bypass mode.
          g = Path("cloudflare/generate-deploy-config.mjs")
          s = g.read_text()
          s = s.replace(
              '''const publishableKey =\n  process.env.VITE_CLERK_PUBLISHABLE_KEY || process.env.CLERK_PUBLISHABLE_KEY;\n\nif (!publishableKey || !/^pk_(?:live|test)_/.test(publishableKey)) {\n  throw new Error(\n    "VITE_CLERK_PUBLISHABLE_KEY (or CLERK_PUBLISHABLE_KEY) is required to generate the Cloudflare deploy config.",\n  );\n}\n''',
              '''const publishableKey =\n  process.env.VITE_CLERK_PUBLISHABLE_KEY || process.env.CLERK_PUBLISHABLE_KEY || "";\nconst pilotAuthBypass = process.env.PILOT_AUTH_BYPASS !== "false";\n\nif (!pilotAuthBypass && (!publishableKey || !/^pk_(?:live|test)_/.test(publishableKey))) {\n  throw new Error(\n    "VITE_CLERK_PUBLISHABLE_KEY (or CLERK_PUBLISHABLE_KEY) is required when pilot auth bypass is disabled.",\n  );\n}\n''',
          )
          s = s.replace(
              '''config.vars = {\n  ...config.vars,\n  CLERK_PUBLISHABLE_KEY: publishableKey,\n};\n''',
              '''config.vars = {\n  ...config.vars,\n  PILOT_AUTH_BYPASS: pilotAuthBypass ? "true" : "false",\n  PILOT_AUTH_USER_ID: process.env.PILOT_AUTH_USER_ID || "pilot001-bypass",\n  ...(publishableKey ? { CLERK_PUBLISHABLE_KEY: publishableKey } : {}),\n};\n''',
          )
          s = s.replace(
              '''    VITE_CLERK_PUBLISHABLE_KEY: publishableKey,\n    VITE_DISABLE_CLERK_PROXY: "true",\n''',
              '''    ...(publishableKey ? { VITE_CLERK_PUBLISHABLE_KEY: publishableKey } : {}),\n    VITE_PILOT_AUTH_BYPASS: pilotAuthBypass ? "true" : "false",\n    PILOT_AUTH_BYPASS: pilotAuthBypass ? "true" : "false",\n    PILOT_AUTH_USER_ID: process.env.PILOT_AUTH_USER_ID || "pilot001-bypass",\n    VITE_DISABLE_CLERK_PROXY: "true",\n''',
          )
          g.write_text(s)

          # Regression test for the server boundary bypass.
          test = Path("artifacts/api-server/src/__tests__/pilot-auth-bypass.test.ts")
          test.write_text('''import { afterEach, describe, expect, it, vi } from "vitest";\nimport type { NextFunction, Request, Response } from "express";\nimport { requireAuth } from "../middlewares/requireAuth";\n\ndescribe("Pilot001 auth bypass", () => {\n  afterEach(() => {\n    delete process.env.PILOT_AUTH_BYPASS;\n    delete process.env.PILOT_AUTH_USER_ID;\n  });\n\n  it("admits API traffic with a stable synthetic identity when explicitly enabled", () => {\n    process.env.PILOT_AUTH_BYPASS = "true";\n    process.env.PILOT_AUTH_USER_ID = "pilot001-test";\n    const req = { method: "GET", path: "/me" } as Request;\n    const res = {} as Response;\n    const next = vi.fn() as unknown as NextFunction;\n    requireAuth(req, res, next);\n    expect(req.userId).toBe("pilot001-test");\n    expect(next).toHaveBeenCalledOnce();\n  });\n});\n''')
          PY
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Focused bypass test
        run: pnpm --filter ./artifacts/api-server exec vitest run src/__tests__/pilot-auth-bypass.test.ts
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Diff check
        run: git diff --check
      - name: Commit verified bypass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/jack-core/src/App.tsx artifacts/api-server/src/app.ts artifacts/api-server/src/middlewares/requireAuth.ts artifacts/api-server/src/lib/admin-auth.ts artifacts/api-server/src/routes/me.ts artifacts/api-server/src/__tests__/pilot-auth-bypass.test.ts Dockerfile.cloudflare cloudflare/wrangler.base.json cloudflare/generate-deploy-config.mjs
          git commit -m "Pilot001: bypass Clerk on Cloudflare runtime"
          git push origin HEAD:pilot001-auth-bypass
