name: Cloudflare Cutover Verification

on:
  push:
    branches:
      - overclock/cloudflare-cutover-20260825
  pull_request:
    branches:
      - main
    paths:
      - "artifacts/api-server/**"
      - "artifacts/jack-core/**"
      - "lib/**"
      - "cloudflare/**"
      - "Dockerfile.cloudflare"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".dockerignore"
      - ".env.cloudflare.example"
      - ".github/workflows/cloudflare-cutover-verify.yml"
      - ".github/workflows/cloudflare-production-deploy.yml"
      - ".github/workflows/live-security-header-verify.yml"

permissions:
  contents: read

env:
  VITE_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Cloudflare deploy config
        run: node cloudflare/generate-deploy-config.mjs
      - name: Validate Cloudflare helper syntax
        run: |
          node --check cloudflare/worker.mjs
          node --check cloudflare/resolve-account-context.mjs
      - name: Cloudflare configuration regression tests
        run: node --test cloudflare/auth-defaults.test.mjs cloudflare/container-lifecycle.test.mjs cloudflare/resolve-account-context.test.mjs
      - name: Format check
        run: pnpm exec prettier --check cloudflare/worker.mjs cloudflare/generate-deploy-config.mjs cloudflare/auth-defaults.test.mjs cloudflare/container-lifecycle.test.mjs cloudflare/resolve-account-context.mjs cloudflare/resolve-account-context.test.mjs cloudflare/wrangler.base.json docs/cloudflare-cutover-pilot.md package.json .github/workflows/cloudflare-cutover-verify.yml .github/workflows/cloudflare-production-deploy.yml .github/workflows/live-security-header-verify.yml
      - name: Cloudflare Worker dry run
        run: npx --yes wrangler@latest deploy --dry-run --config cloudflare/wrangler.generated.json --outdir .wrangler-dry-run
      - name: Build production container image
        run: docker build -f Dockerfile.cloudflare --build-arg VITE_CLERK_PUBLISHABLE_KEY="$VITE_CLERK_PUBLISHABLE_KEY" --build-arg VITE_PILOT_AUTH_BYPASS=false -t jack-core-cloudflare:verify .
      - name: Production container CSP smoke test
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d --rm -p 18080:8080 \
            -e PILOT_AUTH_BYPASS=true \
            -e PILOT_AUTH_USER_ID=pilot001-bypass \
            -e SUPABASE_URL=http://127.0.0.1:9 \
            -e SUPABASE_SERVICE_ROLE_KEY=test-service-role \
            -e OPENAI_API_KEY=test-openai \
            jack-core-cloudflare:verify)"
          cleanup() {
            docker logs "$container_id" || true
            docker stop "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl --silent --fail \
              --dump-header /tmp/jack-root-headers.txt \
              --output /tmp/jack-root-body.html \
              http://127.0.0.1:18080/; then
              break
            fi
            sleep 1
          done

          test -s /tmp/jack-root-headers.txt
          cat /tmp/jack-root-headers.txt
          grep -i -F "content-security-policy:" /tmp/jack-root-headers.txt
          grep -i -F "default-src 'self'" /tmp/jack-root-headers.txt
          grep -i -F "object-src 'none'" /tmp/jack-root-headers.txt
      - name: API full tests
        run: pnpm --filter @workspace/api-server test
      - name: Jack full tests
        run: pnpm --filter @workspace/jack-core test
      - name: Workspace typecheck
        run: pnpm typecheck
      - name: Workspace build
        run: pnpm build
      - name: Diff check
        run: git diff --check origin/main...HEAD
