name: Staging UI Smoke Diagnostic

on:
  push:
    branches:
      - ops/live-ui-smoke-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  staging-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install browser diagnostic
        shell: bash
        run: |
          mkdir -p /tmp/jack-staging-smoke
          cd /tmp/jack-staging-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify staging shell, Clerk sign-in, health, and visible blockers
        shell: bash
        run: |
          cd /tmp/jack-staging-smoke
          cat > smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          (async () => {
            const origin = 'https://staging.jack.torchlabs.ca';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 430, height: 932 },
              userAgent: 'Jack-Staging-Smoke/2026-08-28',
            });
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];
            const page = await context.newPage();
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', (request) => {
              failedRequests.push({ url: request.url(), error: request.failure()?.errorText ?? 'unknown' });
            });

            const result = {
              checkedAt: new Date().toISOString(),
              signIn: {},
              root: {},
              health: {},
              pageErrors,
              consoleErrors,
              failedRequests,
            };

            const signInResponse = await page.goto(`${origin}/sign-in`, {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            await page.waitForTimeout(8000);
            result.signIn = {
              status: signInResponse?.status() ?? null,
              url: page.url(),
              title: await page.title(),
              body: (await page.locator('body').innerText()).slice(0, 2000),
              welcomeBack: await page.getByText('Welcome back', { exact: true }).count(),
              emailInputs: await page.locator('input[type="email"], input[name="identifier"]').count(),
              startingJack: await page.getByText('Starting Jack…', { exact: true }).count(),
              authUnavailable: await page.getByText('Sign-in is temporarily unavailable', { exact: true }).count(),
              visibleBlurOverlays: await page.locator('[class*="backdrop-blur"]:visible').count(),
            };
            await page.screenshot({ path: 'staging-sign-in.png', fullPage: true });

            const rootResponse = await page.goto(`${origin}/`, {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            await page.waitForTimeout(8000);
            result.root = {
              status: rootResponse?.status() ?? null,
              url: page.url(),
              title: await page.title(),
              body: (await page.locator('body').innerText()).slice(0, 2000),
              startingJack: await page.getByText('Starting Jack…', { exact: true }).count(),
              authUnavailable: await page.getByText('Sign-in is temporarily unavailable', { exact: true }).count(),
            };
            await page.screenshot({ path: 'staging-root.png', fullPage: true });

            const healthResponse = await context.request.get(`${origin}/api/healthz`, {
              timeout: 30000,
            });
            result.health = {
              status: healthResponse.status(),
              body: (await healthResponse.text()).slice(0, 2000),
            };

            fs.writeFileSync('staging-result.json', JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));

            const fatal = [];
            if (result.signIn.status !== 200) fatal.push(`sign-in status ${result.signIn.status}`);
            if (result.signIn.authUnavailable > 0) fatal.push('Clerk startup timed out');
            if (result.signIn.startingJack > 0) fatal.push('Clerk startup overlay remained after 8 seconds');
            if (result.signIn.welcomeBack < 1 || result.signIn.emailInputs < 1) fatal.push('sign-in form did not render');
            if (result.signIn.visibleBlurOverlays > 0) fatal.push('visible blur overlay remained on sign-in');
            if (result.root.status !== 200 || !result.root.title.includes('Jack')) fatal.push('Jack landing shell did not render');
            if (result.health.status !== 200) fatal.push(`health status ${result.health.status}`);
            if (!String(result.health.body).includes('"status":"ok"')) fatal.push('health body was not status ok');
            if (pageErrors.length > 0) fatal.push(`${pageErrors.length} page error(s)`);

            await browser.close();
            if (fatal.length) {
              console.error(`STAGING_SMOKE_FAILED: ${fatal.join('; ')}`);
              process.exit(1);
            }
            console.log('STAGING_SMOKE_PASSED');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node smoke.cjs
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-ui-smoke-evidence
          path: |
            /tmp/jack-staging-smoke/staging-result.json
            /tmp/jack-staging-smoke/staging-sign-in.png
            /tmp/jack-staging-smoke/staging-root.png
          if-no-files-found: warn
          retention-days: 3
