name: Staging UI Smoke Diagnostic

on:
  push:
    branches:
      - ops/live-ui-smoke-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  staging-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Wait for staging CSP deployment
        shell: bash
        run: |
          set -euo pipefail
          accepted="false"
          for attempt in $(seq 1 72); do
            curl --silent --show-error --dump-header /tmp/staging-headers.txt --output /tmp/staging-health.json \
              -H 'Cache-Control: no-cache' \
              "https://staging.jack.torchlabs.ca/api/healthz?csp_acceptance=$(date +%s%N)" || true
            if grep -Eqi '^content-security-policy:.*https://clerk\.staging\.jack\.torchlabs\.ca' /tmp/staging-headers.txt \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/staging-health.json; then
              accepted="true"
              echo "Staging is serving the patched CSP and a healthy API."
              break
            fi
            echo "attempt=$attempt waiting for patched staging CSP"
            sleep 8
          done
          if [ "$accepted" != "true" ]; then
            echo "Staging did not serve the patched CSP before the acceptance timeout." >&2
            echo "Headers:" >&2
            cat /tmp/staging-headers.txt >&2 || true
            echo "Health body:" >&2
            cat /tmp/staging-health.json >&2 || true
            exit 1
          fi
      - name: Install browser diagnostic
        shell: bash
        run: |
          mkdir -p /tmp/jack-staging-smoke
          cd /tmp/jack-staging-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify staging Clerk traffic, shell, health, and visible blockers
        shell: bash
        run: |
          cd /tmp/jack-staging-smoke
          cat > smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          (async () => {
            const origin = 'https://staging.jack.torchlabs.ca';
            const clerkOrigin = 'https://clerk.staging.jack.torchlabs.ca';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 430, height: 932 },
              userAgent: 'Jack-Staging-Smoke/2026-08-28',
            });
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];
            const clerkResponses = [];
            const page = await context.newPage();
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', (request) => {
              failedRequests.push({ url: request.url(), error: request.failure()?.errorText ?? 'unknown' });
            });
            page.on('response', (response) => {
              if (response.url().startsWith(`${clerkOrigin}/v1/`)) {
                clerkResponses.push({ url: response.url(), status: response.status() });
              }
            });

            const result = {
              checkedAt: new Date().toISOString(),
              signIn: {},
              root: {},
              health: {},
              pageErrors,
              consoleErrors,
              failedRequests,
              clerkResponses,
            };

            const signInResponse = await page.goto(`${origin}/sign-in`, {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            await page.waitForTimeout(8000);
            result.signIn = {
              status: signInResponse?.status() ?? null,
              url: page.url(),
              title: await page.title(),
              body: (await page.locator('body').innerText()).slice(0, 2000),
              welcomeBack: await page.getByText('Welcome back', { exact: true }).count(),
              emailInputs: await page.locator('input[type="email"], input[name="identifier"]').count(),
              startingJack: await page.getByText('Starting Jack…', { exact: true }).count(),
              authUnavailable: await page.getByText('Sign-in is temporarily unavailable', { exact: true }).count(),
              visibleBlurOverlays: await page.locator('[class*="backdrop-blur"]:visible').count(),
            };
            await page.screenshot({ path: 'staging-sign-in.png', fullPage: true });

            const rootResponse = await page.goto(`${origin}/`, {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            await page.waitForTimeout(8000);
            result.root = {
              status: rootResponse?.status() ?? null,
              url: page.url(),
              title: await page.title(),
              body: (await page.locator('body').innerText()).slice(0, 2000),
              startingJack: await page.getByText('Starting Jack…', { exact: true }).count(),
              authUnavailable: await page.getByText('Sign-in is temporarily unavailable', { exact: true }).count(),
            };
            await page.screenshot({ path: 'staging-root.png', fullPage: true });

            const healthResponse = await context.request.get(`${origin}/api/healthz`, {
              timeout: 30000,
            });
            result.health = {
              status: healthResponse.status(),
              body: (await healthResponse.text()).slice(0, 2000),
            };

            fs.writeFileSync('staging-result.json', JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));

            const fatal = [];
            if (result.signIn.status !== 200) fatal.push(`sign-in status ${result.signIn.status}`);
            if (result.signIn.authUnavailable > 0) fatal.push('Clerk startup timed out');
            if (result.signIn.startingJack > 0) fatal.push('Clerk startup overlay remained after 8 seconds');
            if (result.signIn.welcomeBack < 1 || result.signIn.emailInputs < 1) fatal.push('sign-in form did not render');
            if (result.signIn.visibleBlurOverlays > 0) fatal.push('visible blur overlay remained on sign-in');
            if (!clerkResponses.some((response) => response.url.includes('/v1/environment') && response.status < 400)) {
              fatal.push('Clerk environment request did not succeed');
            }
            if (!clerkResponses.some((response) => response.url.includes('/v1/client') && response.status < 400)) {
              fatal.push('Clerk client request did not succeed');
            }
            if (result.root.status !== 200 || !result.root.title.includes('Jack')) fatal.push('Jack landing shell did not render');
            if (result.health.status !== 200) fatal.push(`health status ${result.health.status}`);
            if (!String(result.health.body).includes('"status":"ok"')) fatal.push('health body was not status ok');
            if (pageErrors.length > 0) fatal.push(`${pageErrors.length} page error(s)`);
            if (consoleErrors.length > 0) fatal.push(`${consoleErrors.length} console error(s)`);
            if (failedRequests.length > 0) fatal.push(`${failedRequests.length} failed request(s)`);

            await browser.close();
            if (fatal.length) {
              console.error(`STAGING_SMOKE_FAILED: ${fatal.join('; ')}`);
              process.exit(1);
            }
            console.log('STAGING_SMOKE_PASSED_STRICT');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node smoke.cjs
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-ui-smoke-evidence
          path: |
            /tmp/jack-staging-smoke/staging-result.json
            /tmp/jack-staging-smoke/staging-sign-in.png
            /tmp/jack-staging-smoke/staging-root.png
          if-no-files-found: warn
          retention-days: 3
