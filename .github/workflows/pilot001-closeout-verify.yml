name: Pilot001 Closeout Verification

on:
  push:
    branches:
      - reconcile/pilot-closeout-20260824

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused API closeout tests
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/__tests__/end-of-shift-closeout.test.ts
      - name: Focused Jack closeout tests
        id: focused_jack
        continue-on-error: true
        run: pnpm --filter @workspace/jack-core exec vitest run src/components/EndOfShiftCloseout.test.tsx --reporter=json --outputFile=closeout-vitest.json
      - name: Upload focused Jack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-jack-closeout-diagnostics
          path: artifacts/jack-core/closeout-vitest.json
          if-no-files-found: error
          retention-days: 1
      - name: Fail on focused Jack test failure
        if: steps.focused_jack.outcome == 'failure'
        run: exit 1
      - name: API typecheck
        run: pnpm --filter @workspace/api-server typecheck
      - name: Jack typecheck
        run: pnpm --filter @workspace/jack-core typecheck
      - name: API full tests
        run: pnpm --filter @workspace/api-server test
      - name: Jack full tests
        run: pnpm --filter @workspace/jack-core test
      - name: API build
        run: pnpm --filter @workspace/api-server build
      - name: Jack build
        run: pnpm --filter @workspace/jack-core build
      - name: Generate prettier reconciliation patch
        id: prettier_patch
        run: |
          pnpm exec prettier --write artifacts/api-server/src/routes/__tests__/end-of-shift-closeout.test.ts artifacts/api-server/src/routes/end-of-shift-closeout.ts artifacts/api-server/src/routes/index.ts artifacts/jack-core/src/App.tsx artifacts/jack-core/src/components/EndOfShiftCloseout.test.tsx artifacts/jack-core/src/components/EndOfShiftCloseout.tsx artifacts/jack-core/src/components/JackShell.tsx artifacts/jack-core/src/lib/user-testing/end-of-shift-closeout-service.ts
          git diff -- artifacts/api-server/src/routes/__tests__/end-of-shift-closeout.test.ts artifacts/api-server/src/routes/end-of-shift-closeout.ts artifacts/api-server/src/routes/index.ts artifacts/jack-core/src/App.tsx artifacts/jack-core/src/components/EndOfShiftCloseout.test.tsx artifacts/jack-core/src/components/EndOfShiftCloseout.tsx artifacts/jack-core/src/components/JackShell.tsx artifacts/jack-core/src/lib/user-testing/end-of-shift-closeout-service.ts > prettier-reconciliation.diff
      - name: Upload prettier reconciliation patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-reconciliation
          path: prettier-reconciliation.diff
          if-no-files-found: error
          retention-days: 1
      - name: Verify format clean
        run: test ! -s prettier-reconciliation.diff
      - name: Diff check
        run: git diff --check HEAD^ HEAD
