name: Restore Jack Railway DNS

on:
  push:
    branches:
      - ops/live-ui-smoke-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  restore-jack-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify Railway origins, restore DNS, and accept public routes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import dns from 'node:dns/promises';
          import https from 'node:https';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('CLOUDFLARE_API_TOKEN is unavailable');

          const bindings = [
            {
              host: 'jack.torchlabs.ca',
              target: '065w3uja.up.railway.app',
              required: true,
            },
            {
              host: 'staging.jack.torchlabs.ca',
              target: 'h3r6mycb.up.railway.app',
              required: false,
            },
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const api = async (path, options = {}) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers ?? {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              const error = new Error(`Cloudflare API ${options.method ?? 'GET'} ${path} failed with ${response.status}`);
              error.details = payload.errors ?? [];
              throw error;
            }
            return payload.result;
          };

          const inspectResponse = async (url) => {
            try {
              const response = await fetch(url, {
                redirect: 'follow',
                headers: { 'cache-control': 'no-cache', 'user-agent': 'Jack-DNS-Recovery/2026-08-28' },
              });
              const text = await response.text();
              return {
                ok: response.ok,
                status: response.status,
                contentType: response.headers.get('content-type') ?? '',
                title: text.match(/<title>([^<]*)<\/title>/i)?.[1] ?? null,
                text,
              };
            } catch (error) {
              return { ok: false, status: 0, contentType: '', title: null, text: '', error: String(error) };
            }
          };

          const forcedHostRequest = async (host, target, path) => {
            const addresses = await dns.resolve4(target);
            if (!addresses.length) throw new Error(`No IPv4 address resolved for ${target}`);
            return await new Promise((resolve, reject) => {
              const request = https.request({
                hostname: host,
                servername: host,
                path,
                method: 'GET',
                timeout: 20000,
                headers: { Host: host, 'User-Agent': 'Jack-DNS-Recovery/2026-08-28', Connection: 'close' },
                lookup: (_hostname, _options, callback) => callback(null, addresses[0], 4),
              }, (response) => {
                const chunks = [];
                response.on('data', (chunk) => chunks.push(chunk));
                response.on('end', () => resolve({
                  status: response.statusCode ?? 0,
                  contentType: String(response.headers['content-type'] ?? ''),
                  text: Buffer.concat(chunks).toString('utf8'),
                  address: addresses[0],
                }));
              });
              request.on('timeout', () => request.destroy(new Error('request timed out')));
              request.on('error', reject);
              request.end();
            });
          };

          const isJackHtml = (result) => result.status === 200 && /Jack — AI Trade Intelligence Engine|application-name[^>]+Jack/i.test(result.text);
          const isHealthy = (result) => {
            if (result.status !== 200 || !/application\/json/i.test(result.contentType)) return false;
            try { return JSON.parse(result.text).status === 'ok'; } catch { return false; }
          };

          const zones = await api('/zones?name=torchlabs.ca&status=active&per_page=50');
          if (!Array.isArray(zones) || zones.length !== 1) throw new Error('Could not resolve the active torchlabs.ca zone');
          const zone = zones[0];
          const before = [];
          const changed = [];

          for (const binding of bindings) {
            const directRoot = await inspectResponse(`https://${binding.target}/`);
            const directHealth = await inspectResponse(`https://${binding.target}/api/healthz`);
            let forcedRoot;
            let forcedHealth;
            try {
              forcedRoot = await forcedHostRequest(binding.host, binding.target, '/');
              forcedHealth = await forcedHostRequest(binding.host, binding.target, '/api/healthz');
            } catch (error) {
              forcedRoot = { status: 0, contentType: '', text: '', error: String(error) };
              forcedHealth = { status: 0, contentType: '', text: '', error: String(error) };
            }

            console.log(JSON.stringify({
              phase: 'origin-preflight',
              host: binding.host,
              target: binding.target,
              direct: {
                root: { status: directRoot.status, title: directRoot.title, jack: isJackHtml(directRoot), error: directRoot.error ?? null },
                health: { status: directHealth.status, healthy: isHealthy(directHealth), error: directHealth.error ?? null },
              },
              forcedCustomHost: {
                root: { status: forcedRoot.status, jack: isJackHtml(forcedRoot), error: forcedRoot.error ?? null },
                health: { status: forcedHealth.status, healthy: isHealthy(forcedHealth), error: forcedHealth.error ?? null },
              },
            }, null, 2));

            const originAcceptsHost = isJackHtml(forcedRoot) && isHealthy(forcedHealth);
            const directOriginHealthy = isJackHtml(directRoot) && isHealthy(directHealth);
            if (!originAcceptsHost && !directOriginHealthy) {
              if (binding.required) throw new Error(`Verified Railway origin is not healthy for ${binding.host}; DNS left unchanged`);
              console.log(`Skipping optional ${binding.host}: Railway origin is not healthy.`);
              continue;
            }

            const records = await api(`/zones/${zone.id}/dns_records?type=CNAME&name=${binding.host}&per_page=100`);
            if (!Array.isArray(records) || records.length !== 1) {
              if (binding.required) throw new Error(`Expected exactly one CNAME for ${binding.host}, found ${Array.isArray(records) ? records.length : 'none'}`);
              console.log(`Skipping optional ${binding.host}: exact CNAME was not found.`);
              continue;
            }

            const record = records[0];
            before.push({
              id: record.id,
              type: record.type,
              name: record.name,
              content: record.content,
              proxied: record.proxied,
              ttl: record.ttl,
              comment: record.comment ?? null,
            });

            const alreadyCorrect = record.content.toLowerCase() === binding.target && record.proxied === false;
            if (!alreadyCorrect) {
              const updated = await api(`/zones/${zone.id}/dns_records/${record.id}`, {
                method: 'PATCH',
                body: JSON.stringify({
                  type: 'CNAME',
                  name: binding.host,
                  content: binding.target,
                  proxied: false,
                  ttl: 1,
                  comment: 'Verified Railway fallback restored during Pilot001 recovery on 2026-08-28',
                }),
              });
              changed.push({ host: binding.host, from: record.content, to: updated.content, proxied: updated.proxied });
            }
          }

          console.log(JSON.stringify({ phase: 'dns-change', before, changed }, null, 2));

          const production = bindings[0];
          let accepted = false;
          let last = null;
          for (let attempt = 1; attempt <= 24; attempt += 1) {
            const root = await inspectResponse(`https://${production.host}/?dns_recovery=${Date.now()}`);
            const health = await inspectResponse(`https://${production.host}/api/healthz?dns_recovery=${Date.now()}`);
            last = {
              attempt,
              root: { status: root.status, title: root.title, jack: isJackHtml(root), error: root.error ?? null },
              health: { status: health.status, healthy: isHealthy(health), error: health.error ?? null },
            };
            console.log(JSON.stringify({ phase: 'public-acceptance', ...last }));
            if (isJackHtml(root) && isHealthy(health)) {
              accepted = true;
              break;
            }
            await sleep(5000);
          }

          if (!accepted) {
            const forcedRoot = await forcedHostRequest(production.host, production.target, '/');
            const forcedHealth = await forcedHostRequest(production.host, production.target, '/api/healthz');
            if (!isJackHtml(forcedRoot) || !isHealthy(forcedHealth)) {
              const original = before.find((record) => record.name === production.host);
              if (original && changed.some((entry) => entry.host === production.host)) {
                await api(`/zones/${zone.id}/dns_records/${original.id}`, {
                  method: 'PATCH',
                  body: JSON.stringify({
                    type: original.type,
                    name: original.name,
                    content: original.content,
                    proxied: original.proxied,
                    ttl: original.ttl,
                    comment: original.comment,
                  }),
                });
                console.error('Production DNS rolled back because both public and forced-host acceptance failed.');
              }
              throw new Error(`Jack public acceptance failed: ${JSON.stringify(last)}`);
            }
            console.log('Authoritative route is healthy through the restored Railway target; public resolver propagation is still catching up.');
          } else {
            console.log('JACK_PRODUCTION_DNS_RESTORED_AND_ACCEPTED');
          }
          NODE
