name: Cloudflare Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PILOT_AUTH_BYPASS: "true"
  PILOT_AUTH_USER_ID: "pilot001-bypass"
  WRANGLER_OUTPUT_FILE_PATH: .wrangler-output.json
  WRANGLER_LOG_SANITIZE: "true"

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fail closed on Cloudflare API token
        shell: bash
        run: |
          node <<'NODE'
          if (!process.env.CLOUDFLARE_API_TOKEN) {
            console.error("Missing required GitHub Actions secret: CLOUDFLARE_API_TOKEN");
            process.exit(1);
          }
          console.log("Cloudflare API token preflight passed.");
          NODE

      - name: Resolve Cloudflare account context
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const configuredAccountId = (process.env.CONFIGURED_CLOUDFLARE_ACCOUNT_ID || "").trim();

          async function cloudflare(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              const errors = Array.isArray(payload.errors)
                ? payload.errors.map((entry) => entry.message || entry.code).join("; ")
                : "unknown Cloudflare API error";
              throw new Error(`${response.status} ${errors}`);
            }
            return Array.isArray(payload.result) ? payload.result : [];
          }

          let accountId = configuredAccountId;
          let source = configuredAccountId ? "optional repository override" : "";

          if (!accountId) {
            try {
              const zones = await cloudflare("/zones?name=torchlabs.ca&per_page=50");
              const zone = zones.find(
                (entry) => entry && entry.name === "torchlabs.ca" && entry.account && entry.account.id,
              );
              if (zone) {
                accountId = zone.account.id;
                source = "torchlabs.ca zone ownership";
              }
            } catch (error) {
              console.warn(`Zone-based account discovery unavailable: ${error.message}`);
            }
          }

          if (!accountId) {
            const accounts = await cloudflare("/accounts?per_page=50");
            const unique = [...new Map(accounts.filter((entry) => entry && entry.id).map((entry) => [entry.id, entry])).values()];
            const torchMatches = unique.filter((entry) => /\btorch\b/i.test(entry.name || ""));
            const candidate = torchMatches.length === 1 ? torchMatches[0] : unique.length === 1 ? unique[0] : null;
            if (!candidate) {
              console.error(
                `Unable to resolve a single Torch Cloudflare account from token scope (${unique.length} accounts visible).`,
              );
              console.error(
                "Optional fallback: set CLOUDFLARE_ACCOUNT_ID as a repository Actions secret, then rerun.",
              );
              process.exit(1);
            }
            accountId = candidate.id;
            source = torchMatches.length === 1 ? "unique Torch-named account" : "single token-visible account";
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ACCOUNT_ID=${accountId}\n`);
          console.log(`Cloudflare account context resolved via ${source}.`);
          NODE

      - name: Verify Cloudflare authentication
        run: npx --yes wrangler@latest whoami

      - name: Generate Cloudflare deploy config
        run: node cloudflare/generate-deploy-config.mjs

      - name: Validate Worker syntax
        run: node --check cloudflare/worker.mjs

      - name: Format check
        run: pnpm exec prettier --check cloudflare/worker.mjs cloudflare/generate-deploy-config.mjs cloudflare/wrangler.base.json docs/cloudflare-cutover-pilot.md .github/workflows/cloudflare-production-deploy.yml

      - name: Wrangler dry run
        run: npx --yes wrangler@latest deploy --dry-run --config cloudflare/wrangler.generated.json --outdir .wrangler-dry-run

      - name: Build production container image
        run: docker build -f Dockerfile.cloudflare -t jack-core-cloudflare:deploy .

      - name: API full tests
        run: pnpm --filter @workspace/api-server test

      - name: Jack full tests
        run: pnpm --filter @workspace/jack-core test

      - name: Workspace typecheck
        run: pnpm typecheck

      - name: Workspace build
        run: pnpm build

      - name: Diff check
        run: git diff --check HEAD^

      - name: Deploy Worker + Container to workers.dev
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.generated.json

      - name: Resolve deployed workers.dev target
        id: deployment
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const rows = fs
            .readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8")
            .trim()
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const deploy = [...rows].reverse().find((row) => row.type === "deploy");
          if (!deploy || !Array.isArray(deploy.targets) || !deploy.targets.length) {
            console.error("Wrangler deploy output did not contain a deployment target.");
            process.exit(1);
          }
          const target = deploy.targets.find((value) => value.includes("workers.dev")) || deploy.targets[0];
          console.log(`target=${target}`);
          console.log(`version_id=${deploy.version_id || "unknown"}`);
          NODE

      - name: Smoke-test workers.dev deployment
        shell: bash
        run: |
          target="${{ steps.deployment.outputs.target }}"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$target/" > /dev/null
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$target/api/healthz" | tee /tmp/healthz.json
          node -e 'const fs=require("node:fs"); const body=JSON.parse(fs.readFileSync("/tmp/healthz.json","utf8")); if(body.status!=="ok") process.exit(1)'

      - name: Record deployment evidence
        shell: bash
        run: |
          {
            echo "## Cloudflare workers.dev acceptance"
            echo "- target: ${{ steps.deployment.outputs.target }}"
            echo "- version: ${{ steps.deployment.outputs.version_id }}"
            echo "- public shell: PASS"
            echo "- /api/healthz: PASS"
            echo "- production DNS: unchanged (Railway rollback preserved)"
          } >> "$GITHUB_STEP_SUMMARY"
