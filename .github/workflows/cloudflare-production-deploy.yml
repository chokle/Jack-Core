name: Cloudflare Production Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".agents/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

env:
  PILOT_AUTH_BYPASS: "false"
  WRANGLER_OUTPUT_FILE_PATH: .wrangler-output.json
  WRANGLER_LOG_SANITIZE: "true"

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fail closed on production credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          node <<'NODE'
          if (!process.env.CLOUDFLARE_API_TOKEN) {
            console.error("Missing required GitHub Actions secret: CLOUDFLARE_API_TOKEN");
            process.exit(1);
          }
          const requiredRuntimeSecrets = [
            "SUPABASE_URL",
            "SUPABASE_SERVICE_ROLE_KEY",
            "CLERK_SECRET_KEY",
            "OPENAI_API_KEY",
            "ADMIN_EMAILS",
          ];
          const missingRuntimeSecrets = requiredRuntimeSecrets.filter(
            (name) => !process.env[name],
          );
          if (missingRuntimeSecrets.length > 0) {
            console.error(
              `Missing required GitHub Actions secrets: ${missingRuntimeSecrets.join(", ")}`,
            );
            process.exit(1);
          }
          if (!/^pk_(?:live|test)_/.test(process.env.VITE_CLERK_PUBLISHABLE_KEY || "")) {
            console.error("Missing or invalid GitHub Actions secret: VITE_CLERK_PUBLISHABLE_KEY");
            process.exit(1);
          }
          console.log("Cloudflare and Clerk credential preflight passed.");
          NODE

      - name: Resolve Cloudflare account context
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node cloudflare/resolve-account-context.mjs

      - name: Verify Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest whoami

      - name: Generate Cloudflare deploy config
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: node cloudflare/generate-deploy-config.mjs

      - name: Validate Cloudflare helper syntax
        run: |
          node --check cloudflare/worker.mjs
          node --check cloudflare/resolve-account-context.mjs

      - name: Cloudflare configuration regression tests
        run: node --test cloudflare/auth-defaults.test.mjs cloudflare/resolve-account-context.test.mjs

      - name: Format check
        run: pnpm exec prettier --check cloudflare/worker.mjs cloudflare/generate-deploy-config.mjs cloudflare/auth-defaults.test.mjs cloudflare/resolve-account-context.mjs cloudflare/resolve-account-context.test.mjs cloudflare/wrangler.base.json docs/cloudflare-cutover-pilot.md .github/workflows/cloudflare-production-deploy.yml

      - name: Wrangler dry run
        run: npx --yes wrangler@latest deploy --dry-run --config cloudflare/wrangler.generated.json --outdir .wrangler-dry-run

      - name: Build production container image
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: docker build -f Dockerfile.cloudflare --build-arg VITE_CLERK_PUBLISHABLE_KEY="$VITE_CLERK_PUBLISHABLE_KEY" --build-arg VITE_PILOT_AUTH_BYPASS=false -t jack-core-cloudflare:deploy .

      - name: API full tests
        run: pnpm --filter @workspace/api-server test

      - name: Jack full tests
        run: pnpm --filter @workspace/jack-core test

      - name: Workspace typecheck
        run: pnpm typecheck

      - name: Workspace build
        run: pnpm build

      - name: Diff check
        run: git diff --check HEAD^

      - name: Prepare Worker secret handoff
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const path = require("node:path");
          const names = [
            "SUPABASE_URL",
            "SUPABASE_SERVICE_ROLE_KEY",
            "CLERK_SECRET_KEY",
            "OPENAI_API_KEY",
            "ADMIN_EMAILS",
          ];
          const secrets = Object.fromEntries(
            names.map((name) => [name, process.env[name]]),
          );
          writeFileSync(
            path.join(process.env.RUNNER_TEMP, "cloudflare-secrets.json"),
            JSON.stringify(secrets),
            { encoding: "utf8", mode: 0o600 },
          );
          NODE

      - name: Deploy Worker + Container to workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.generated.json --secrets-file "$RUNNER_TEMP/cloudflare-secrets.json"

      - name: Resolve deployed workers.dev target
        id: deployment
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const rows = fs
            .readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8")
            .trim()
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const deploy = [...rows].reverse().find((row) => row.type === "deploy");
          if (!deploy || !Array.isArray(deploy.targets) || !deploy.targets.length) {
            console.error("Wrangler deploy output did not contain a deployment target.");
            process.exit(1);
          }
          if (!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(deploy.version_id || "")) {
            console.error("Wrangler deploy output did not contain a valid Worker version ID.");
            process.exit(1);
          }
          const target = deploy.targets.find((value) => value.includes("workers.dev")) || deploy.targets[0];
          console.log(`target=${target}`);
          console.log(`version_id=${deploy.version_id}`);
          console.log(`container_tag=jack-core-production:${deploy.version_id.split("-")[0]}`);
          NODE

      - name: Resolve deployed container digest
        id: container
        shell: bash
        run: |
          container_tag="${{ steps.deployment.outputs.container_tag }}"
          image_version="${container_tag##*:}"
          registry_tag="$(docker image ls --format '{{.Repository}}:{{.Tag}}' | node -e '
            const fs = require("node:fs");
            const suffix = `/jack-core-production:${process.argv[1]}`;
            const tags = fs.readFileSync(0, "utf8").split(/\r?\n/).filter(Boolean);
            const tag = tags.find((value) => value.startsWith("registry.cloudflare.com/") && value.endsWith(suffix));
            process.stdout.write(tag ?? "");
          ' "$image_version")"

          if [[ -z "$registry_tag" ]]; then
            echo "::error::Wrangler did not leave the pushed registry tag for ${container_tag}."
            exit 1
          fi

          repo_digests="$(docker image inspect "$registry_tag" --format '{{json .RepoDigests}}')"
          expected_digest="$(node -e '
            const refs = JSON.parse(process.argv[1]) ?? [];
            const ref = refs.find((value) => /\/jack-core-production@sha256:[0-9a-f]{64}$/i.test(value));
            process.stdout.write(ref?.split("@").at(-1) ?? "");
          ' "$repo_digests")"

          if [[ ! "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve the pushed Cloudflare container digest for ${registry_tag}."
            exit 1
          fi

          echo "expected_digest=$expected_digest" >> "$GITHUB_OUTPUT"
          echo "Cloudflare rollout must activate container digest ${expected_digest}."

      - name: Wait for exact workers.dev rollout acceptance
        timeout-minutes: 35
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -u
          target="${{ steps.deployment.outputs.target }}"
          release="${{ steps.deployment.outputs.version_id }}"
          expected_digest="${{ steps.container.outputs.expected_digest }}"
          ready=false
          primary_attempts=120
          terminal_grace_attempts=12
          total_attempts=$((primary_attempts + terminal_grace_attempts))

          # Cloudflare may give a replaced instance up to 15 minutes to drain.
          # Keep the established primary polling floor, then reconcile for a
          # narrowly bounded grace period in case the control plane crosses over
          # immediately after that floor. The 35-minute step timeout remains the
          # outer bound for both phases and their API calls.
          for attempt in $(seq 1 "$total_attempts"); do
            rollout_phase="primary"
            if (( attempt > primary_attempts )); then
              rollout_phase="terminal-grace"
            fi

            applications="$(npx --yes wrangler@latest containers list --json || true)"
            mapfile -t application_fields < <(node -e '
              try {
                const payload = JSON.parse(process.argv[1]);
                const rows = Array.isArray(payload) ? payload : payload.result ?? payload.applications ?? [];
                const application = rows.find((row) => row.name === "jack-core-production");
                console.log(application?.id ?? application?.application_id ?? "");
                console.log(application?.state ?? "missing");
                console.log(application?.image ?? "");
                console.log(application?.version ?? "");
              } catch {
                console.log("");
                console.log("unavailable");
                console.log("");
                console.log("");
              }
            ' "$applications")
            application_id="${application_fields[0]:-}"
            application_state="${application_fields[1]:-unavailable}"
            application_image="${application_fields[2]:-}"
            application_version="${application_fields[3]:-}"
            reported_digest="${application_image##*@}"

            image_match=false
            if [[ "$reported_digest" == "$expected_digest" ]]; then
              image_match=true
            fi

            warmup_status="not-checked"
            root_status="not-checked"
            health_status="not-checked"
            auth_status="not-checked"
            health_ok=false
            auth_ok=false
            instance_state="not-checked"
            instance_version=""
            instance_version_match=false
            postprobe_instance_state="not-checked"
            postprobe_instance_version=""
            postprobe_instance_version_match=false

            if [[ "$image_match" == "true" && "$application_state" =~ ^(active|ready)$ ]]; then
              warmup_status="$(curl --silent --show-error --output /tmp/jack-warmup.html --write-out '%{http_code}' --header 'Cache-Control: no-cache' --max-time 30 "$target/?release=$release&attempt=$attempt&phase=warmup" || true)"
            fi

            if [[ "$warmup_status" == "200" && -n "$application_id" ]]; then
              instances="$(npx --yes wrangler@latest containers instances "$application_id" --json || true)"
              mapfile -t instance_fields < <(node -e '
                try {
                  const payload = JSON.parse(process.argv[1]);
                  const rows = Array.isArray(payload) ? payload : payload.instances ?? [];
                  const instance = rows.find((row) => row.name === "jack-production");
                  console.log(instance?.state ?? "missing");
                  console.log(instance?.version ?? "");
                } catch {
                  console.log("unavailable");
                  console.log("");
                }
              ' "$instances")
              instance_state="${instance_fields[0]:-unavailable}"
              instance_version="${instance_fields[1]:-}"
              if [[ "$instance_state" == "running" && -n "$application_version" && "$instance_version" == "$application_version" ]]; then
                instance_version_match=true
              fi
            fi

            if [[ "$instance_version_match" == "true" ]]; then
              root_status="$(curl --silent --show-error --output /tmp/jack-readiness.html --write-out '%{http_code}' --header 'Cache-Control: no-cache' --max-time 15 "$target/?release=$release&attempt=$attempt&phase=acceptance" || true)"
              if [[ "$root_status" == "200" ]]; then
                health_status="$(curl --silent --show-error --output /tmp/jack-healthz.json --write-out '%{http_code}' --header 'Cache-Control: no-cache' --max-time 15 "$target/api/healthz?release=$release&attempt=$attempt" || true)"
                if [[ "$health_status" == "200" ]] && node -e '
                  const fs = require("node:fs");
                  try {
                    const body = JSON.parse(fs.readFileSync("/tmp/jack-healthz.json", "utf8"));
                    process.exit(body.status === "ok" ? 0 : 1);
                  } catch {
                    process.exit(1);
                  }
                '; then
                  health_ok=true
                  auth_status="$(curl --silent --show-error --output /tmp/jack-unauthorized.json --write-out '%{http_code}' --header 'Cache-Control: no-cache' --max-time 15 "$target/api/me?release=$release&attempt=$attempt" || true)"
                  if [[ "$auth_status" == "401" ]] && node -e '
                    const fs = require("node:fs");
                    try {
                      const body = JSON.parse(fs.readFileSync("/tmp/jack-unauthorized.json", "utf8"));
                      process.exit(String(body.error || "").includes("sign in required") ? 0 : 1);
                    } catch {
                      process.exit(1);
                    }
                  '; then
                    auth_ok=true
                  fi
                fi
              fi
            fi

            if [[ "$auth_ok" == "true" && -n "$application_id" ]]; then
              postprobe_instances="$(npx --yes wrangler@latest containers instances "$application_id" --json || true)"
              mapfile -t postprobe_instance_fields < <(node -e '
                try {
                  const payload = JSON.parse(process.argv[1]);
                  const rows = Array.isArray(payload) ? payload : payload.instances ?? [];
                  const instance = rows.find((row) => row.name === "jack-production");
                  console.log(instance?.state ?? "missing");
                  console.log(instance?.version ?? "");
                } catch {
                  console.log("unavailable");
                  console.log("");
                }
              ' "$postprobe_instances")
              postprobe_instance_state="${postprobe_instance_fields[0]:-unavailable}"
              postprobe_instance_version="${postprobe_instance_fields[1]:-}"
              if [[ "$postprobe_instance_state" == "running" && -n "$application_version" && "$postprobe_instance_version" == "$application_version" ]]; then
                postprobe_instance_version_match=true
              fi
            fi

            echo "workers.dev rollout attempt ${attempt}/${total_attempts}: phase=${rollout_phase}, app_state=${application_state}, image_match=${image_match}, warmup=${warmup_status:-000}, preprobe_instance_state=${instance_state}, preprobe_instance_version_match=${instance_version_match}, postprobe_instance_state=${postprobe_instance_state}, postprobe_instance_version_match=${postprobe_instance_version_match}, root=${root_status:-000}, health=${health_status:-000}, anonymous_api_me=${auth_status:-000}"

            if [[ "$image_match" == "true" && "$instance_version_match" == "true" && "$postprobe_instance_version_match" == "true" && "$root_status" == "200" && "$health_ok" == "true" && "$auth_ok" == "true" ]]; then
              ready=true
              break
            fi

            if (( attempt % 3 == 0 )) && [[ -n "$application_id" ]]; then
              npx --yes wrangler@latest containers instances "$application_id" --json || true
            fi

            if (( attempt == primary_attempts )); then
              echo "::notice::Primary rollout window exhausted; entering ${terminal_grace_attempts}-attempt terminal reconciliation grace."
            fi

            if (( attempt < total_attempts )); then
              sleep 10
            fi
          done

          if [[ "$ready" != "true" ]]; then
            echo "::error::workers.dev did not activate ${expected_digest} on the serving container instance with a healthy shell and fail-closed anonymous auth within ${primary_attempts} primary attempts plus the ${terminal_grace_attempts}-attempt terminal reconciliation grace."
            exit 1
          fi

      - name: Smoke-test workers.dev deployment
        shell: bash
        run: |
          target="${{ steps.deployment.outputs.target }}"
          release="${{ steps.deployment.outputs.version_id }}"
          curl --fail --silent --show-error --header 'Cache-Control: no-cache' --max-time 30 "$target/?release=$release" > /dev/null
          curl --fail --silent --show-error --header 'Cache-Control: no-cache' --max-time 30 "$target/api/healthz?release=$release" | tee /tmp/healthz.json
          node -e 'const fs=require("node:fs"); const body=JSON.parse(fs.readFileSync("/tmp/healthz.json","utf8")); if(body.status!=="ok") process.exit(1)'
          auth_status="$(curl --silent --show-error --output /tmp/unauthorized.json --write-out '%{http_code}' --header 'Cache-Control: no-cache' --max-time 30 "$target/api/me?release=$release")"
          test "$auth_status" = "401"
          node -e 'const fs=require("node:fs"); const body=JSON.parse(fs.readFileSync("/tmp/unauthorized.json","utf8")); if(!String(body.error||"").includes("sign in required")) process.exit(1)'

      - name: Capture failed startup diagnostics
        if: failure()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          log_path="$RUNNER_TEMP/cloudflare-tail.jsonl"
          timeout 45s npx --yes wrangler@latest tail jack-core-production \
            --format json \
            --header "X-Jack-Diagnostic:ci-smoke" > "$log_path" 2>&1 &
          tail_pid=$!
          sleep 8
          target="${{ steps.deployment.outputs.target }}"
          if [[ -n "$target" ]]; then
            curl --silent --show-error --max-time 30 \
              --header "X-Jack-Diagnostic: ci-smoke" \
              "$target/api/healthz" > /dev/null || true
          fi
          wait "$tail_pid" || true
          node - "$log_path" <<'NODE'
          const { readFileSync } = require("node:fs");
          const rows = readFileSync(process.argv[2], "utf8")
            .split(/\r?\n/)
            .flatMap((line) => {
              try {
                const row = JSON.parse(line);
                return [{
                  outcome: row.outcome,
                  exceptions: row.exceptions,
                  logs: row.logs,
                }];
              } catch {
                return [];
              }
            });
          console.log(JSON.stringify(rows, null, 2));
          NODE

          applications="$(npx --yes wrangler@latest containers list --json)"
          printf '%s\n' "$applications"
          application_id="$(node -e '
            const payload = JSON.parse(process.argv[1]);
            const rows = Array.isArray(payload) ? payload : payload.result ?? payload.applications ?? [];
            const application = rows.find((row) => row.name === "jack-core-production");
            process.stdout.write(application?.id ?? application?.application_id ?? "");
          ' "$applications")"
          if [[ -n "$application_id" ]]; then
            npx --yes wrangler@latest containers instances "$application_id" --json
          else
            echo "Cloudflare did not return the jack-core-production container application."
          fi

      - name: Record deployment evidence
        shell: bash
        run: |
          {
            echo "## Cloudflare workers.dev acceptance"
            echo "- target: ${{ steps.deployment.outputs.target }}"
            echo "- version: ${{ steps.deployment.outputs.version_id }}"
            echo "- container digest: ${{ steps.container.outputs.expected_digest }}"
            echo "- exact container rollout: PASS"
            echo "- serving instance version: PASS"
            echo "- public shell: PASS"
            echo "- /api/healthz: PASS"
            echo "- anonymous /api/me rejected: PASS (401)"
            echo "- approved Clerk sign-in: REQUIRES LIVE ACCEPTANCE"
            echo "- production DNS: unchanged (Railway rollback preserved)"
          } >> "$GITHUB_STEP_SUMMARY"
