name: Bootstrap Cloudflare Container Class Lock

on:
  push:
    branches:
      - overclock/cloudflare-container-class-20260828
    paths:
      - ".github/workflows/bootstrap-cloudflare-container-class.yml"

permissions:
  contents: write

jobs:
  lock-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: overclock/cloudflare-container-class-20260828
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Add the official Cloudflare Container helper
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'const p=require("./package.json"); process.exit(p.dependencies?.["@cloudflare/containers"] === "0.3.7" ? 0 : 1)'; then
            echo "@cloudflare/containers 0.3.7 is already locked."
            exit 0
          fi
          pnpm add --workspace-root --save-exact @cloudflare/containers@0.3.7
          git config user.name "Torch Deployment QC"
          git config user.email "24825492+chokle@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: lock @cloudflare/containers 0.3.7"
          git push origin HEAD:overclock/cloudflare-container-class-20260828
